[workspace]

[package]
name = "rax-smir-portable-capi"
version = "0.1.0"
edition = "2024"
license = "MIT AND BSD-3-Clause"
description = "The host C interface of the portable SMIR runtime"

[lib]
# A static library for programs in C and C++ to link, a shared library for
# the launchers of programs that use an installed runtime, and a Rust
# library for this crate's own tests.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
rax-smir-portable = { path = "../smir-portable" }
