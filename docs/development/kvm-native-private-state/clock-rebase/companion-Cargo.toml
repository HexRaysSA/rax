[package]
name = "rax-kvm-clock-contract"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
kvm-bindings = { version = "=0.14.2", features = ["fam-wrappers", "serde"] }
kvm-ioctls = "=0.25.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uklad = { version = "=1.0.0", default-features = false, features = ["std", "serde"] }
zerocopy = { version = "=0.8.23", features = ["derive"] }
libc = "=0.2.189"
