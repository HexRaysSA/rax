name: Portable SMIR runtime

# The engine, its command-line tools and its host C interface, on the six
# hosts the platform is for. The compiler is not built here: it needs the
# pinned LLVM checkout, and what it produces is the same on every host.

on:
  push:
    paths:
      - 'crates/smir-portable/**'
      - 'crates/smir-portable-capi/**'
      - 'crates/smir-portable-foreign/**'
      - 'src/smir/portable/**'
      - 'tools/smir-format/**'
      - 'tools/smir-clang/smirpack.py'
      - 'tools/smir-runtime-contract/include/**'
      - 'docs/specifications/smir/portable/schema/**'
      - 'docs/specifications/smir/portable/conformance/**'
      - '.github/workflows/smir-portable.yml'
  pull_request:
    paths:
      - 'crates/smir-portable/**'
      - 'crates/smir-portable-capi/**'
      - 'crates/smir-portable-foreign/**'
      - 'src/smir/portable/**'
      - 'tools/smir-format/**'
      - 'tools/smir-clang/smirpack.py'
      - 'tools/smir-runtime-contract/include/**'
      - 'docs/specifications/smir/portable/schema/**'
      - 'docs/specifications/smir/portable/conformance/**'
      - '.github/workflows/smir-portable.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  runtime:
    name: runtime (${{ matrix.host.name }})
    runs-on: ${{ matrix.host.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        host:
          # `reference` is whether the tests that compare the interpreter
          # with the Python reference machine run: they take the longest,
          # and say the same on every host.
          - { name: linux-x64,     os: ubuntu-24.04,     reference: true }
          - { name: linux-arm64,   os: ubuntu-24.04-arm, reference: true }
          - { name: macos-arm64,   os: macos-15,         reference: true }
          - { name: macos-intel,   os: macos-15-intel,   reference: false }
          - { name: windows-x64,   os: windows-2025,     reference: false }
          - { name: windows-arm64, os: windows-11-arm,   reference: false }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          cache-key: smir-portable-${{ matrix.host.name }}
          workspaces: |
            crates/smir-portable
            crates/smir-portable-capi
      - name: Unit tests
        run: cargo test --locked --manifest-path crates/smir-portable/Cargo.toml --lib
      - name: Programs on both engines, with the reference machine
        if: matrix.host.reference
        run: cargo test --locked --manifest-path crates/smir-portable/Cargo.toml --test interp
      - name: Programs on both engines
        if: ${{ !matrix.host.reference }}
        run: >
          cargo test --locked --manifest-path crates/smir-portable/Cargo.toml --test interp --
          --skip reference --skip committed --skip command_line_runner_prints --skip batch_mode
      # The static library first: the tests link a C program with it.
      - name: Host C interface
        run: |
          cargo build --locked --manifest-path crates/smir-portable-capi/Cargo.toml
          cargo test --locked --manifest-path crates/smir-portable-capi/Cargo.toml
      # An executable of a module of the tests, which writes the first five
      # bytes of its argument and returns the number of its arguments and
      # 100: one that carries the runtime, and one that loads the runtime's
      # shared library from where it was built. Mach-O and ELF; no PE
      # executable is made yet.
      - name: Executables that carry or find the runtime
        if: runner.os != 'Windows'
        shell: bash
        run: |
          module=crates/smir-portable/tests/interp/programs/services.smo
          library=$(ls "$PWD"/crates/smir-portable-capi/target/debug/librax_smir_portable_capi.{so,dylib} 2>/dev/null | head -n 1)
          python3 tools/smir-clang/smirpack.py "$module" -o "$RUNNER_TEMP/carries"
          python3 tools/smir-clang/smirpack.py "$module" --installed --runtime "$library" -o "$RUNNER_TEMP/finds"
          for program in carries finds; do
            status=0
            written=$("$RUNNER_TEMP/$program" carried) || status=$?
            echo "$program: wrote '$written', ended with $status"
            test "$written" = carri
            test "$status" -eq 102
          done

  # The processor for foreign code: x86-64 and AArch64 machine code of the
  # tests' images under the emulator's user-mode cores, called from modules
  # on both engines. It builds the emulator, so it is a job of its own, on
  # one host of each architecture and system the emulator's own workflows
  # build it for.
  foreign:
    name: foreign code (${{ matrix.host.name }})
    runs-on: ${{ matrix.host.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        host:
          - { name: linux-x64,   os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-15 }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          cache-key: smir-portable-foreign-${{ matrix.host.name }}
          workspaces: |
            crates/smir-portable-foreign
      - name: Foreign code on the emulator's cores
        run: cargo test --locked --manifest-path crates/smir-portable-foreign/Cargo.toml
