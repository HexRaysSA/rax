name: Linux installed processes

on:
  push:
    paths:
      - '.github/workflows/linux-installed-musl.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'capi/Cargo.toml'
      - 'capi/src/process/**'
      - 'capi/src/tests/process/native_runtime.rs'
      - 'tests/fixtures/user/linux/src/installed_pipe.c'
      - 'tests/fixtures/user/linux/src/installed_spawn.c'
      - 'src/user/image/elf/**'
      - 'src/user/linux/**'
      - 'src/user/mm/**'
      - 'src/user/supplied_fs.rs'
      - 'src/user/supplied_fs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-musl:
    name: Closed installed processes (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          cache-key: linux-installed-musl
      - name: Compare native and emulated musl execution
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          dpkg-query -W musl musl-tools
          work="$PWD/target/ci-linux-installed-musl"
          mkdir -p "$work"
          export TMPDIR="$work"
          export RAX_LINUX_MUSL_PROGRAM="$work/musl-puts"
          printf '%s\n' '#include <stdio.h>' 'int main(void) { puts("installed musl libc"); return 24; }' |
            musl-gcc -x c - -o "$RAX_LINUX_MUSL_PROGRAM"
          readlink -f /lib/ld-musl-x86_64.so.1
          readelf -l -d "$RAX_LINUX_MUSL_PROGRAM"
          cargo test --locked -p rax-capi --no-default-features installed_musl_matches_native_through_closed_c_abi -- --ignored --nocapture
      - name: Compare native and emulated cat with the null device
        run: cargo test --locked -p rax-capi --no-default-features installed_cat_reads_guest_null_through_closed_c_abi -- --nocapture
      - name: Compare native and emulated head with the zero device
        run: cargo test --locked -p rax-capi --no-default-features installed_head_reads_guest_zero_through_closed_c_abi -- --nocapture
      - name: Compare native and emulated process image replacement
        run: cargo test --locked -p rax-capi --no-default-features installed_shell_replaces_its_image_through_closed_c_abi -- --nocapture
      - name: Compare native and emulated shell pipelines
        run: cargo test --locked -p rax-capi --no-default-features installed_shell_pipeline_matches_native_through_closed_c_abi -- --nocapture
      - name: Compare native and emulated gzip byte streams
        run: cargo test --locked -p rax-capi --no-default-features installed_gzip_matches_native_binary_output_through_closed_c_abi -- --nocapture
      - name: Compare native and emulated installed glibc posix_spawn
        shell: bash
        run: |
          work="$PWD/target/ci-linux-installed-spawn"
          mkdir -p "$work"
          export TMPDIR="$work"
          export RAX_LINUX_INSTALLED_SPAWN="$work/installed-spawn"
          cc -std=c11 -Wall -Wextra -Werror tests/fixtures/user/linux/src/installed_spawn.c -o "$RAX_LINUX_INSTALLED_SPAWN"
          cargo test --locked -p rax-capi --no-default-features installed_libc_spawn_matches_native_through_closed_c_abi -- --ignored --nocapture
      - name: Compare native and emulated installed glibc posix_spawn with a sibling thread
        shell: bash
        run: |
          work="$PWD/target/ci-linux-installed-spawn"
          mkdir -p "$work"
          export TMPDIR="$work"
          export RAX_LINUX_INSTALLED_SPAWN="$work/installed-threaded-spawn"
          cc -std=c11 -Wall -Wextra -Werror -pthread -DRAX_THREADED_SPAWN \
            tests/fixtures/user/linux/src/installed_spawn.c -o "$RAX_LINUX_INSTALLED_SPAWN"
          cargo test --locked -p rax-capi --no-default-features installed_libc_spawn_matches_native_through_closed_c_abi -- --ignored --nocapture
      - name: Compare native and emulated anonymous pipes
        shell: bash
        run: |
          work="$PWD/target/ci-linux-installed-pipe"
          mkdir -p "$work"
          export TMPDIR="$work"
          export RAX_LINUX_INSTALLED_PIPE="$work/installed-pipe"
          cc -std=c11 -Wall -Wextra -Werror tests/fixtures/user/linux/src/installed_pipe.c -o "$RAX_LINUX_INSTALLED_PIPE"
          cargo test --locked -p rax-capi --no-default-features installed_libc_pipe_matches_native_through_closed_c_abi -- --ignored --nocapture
      - name: Compare native and emulated system Python
        shell: bash
        env:
          # The x86-64 interpreter uses timed slices. Optimize the test binary
          # so Python startup can make useful progress within its turn bound.
          CARGO_PROFILE_TEST_OPT_LEVEL: '2'
          RAX_LINUX_SYSTEM_PYTHON: /usr/bin/python3
        run: |
          "$RAX_LINUX_SYSTEM_PYTHON" --version
          "$RAX_LINUX_SYSTEM_PYTHON" -I -S -c 'import _sqlite3; print(_sqlite3.__file__)'
          readlink -f "$RAX_LINUX_SYSTEM_PYTHON"
          cargo test --locked -p rax-capi --no-default-features installed_system_python_matches_native_through_closed_c_abi -- --ignored --nocapture
