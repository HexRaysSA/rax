name: Licensing

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution:
    name: Distribution boundaries (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          cache: 'false'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # The package checker resolves locked git dependencies on fresh runners.
      # Do not force Cargo offline before their first checkout.
      - run: python tools/licensing/check.py
      - run: python -m unittest discover -s tools/licensing -p 'test_*.py' -v
      - run: python -m unittest discover -s tools/capi -p 'test_*.py' -v
