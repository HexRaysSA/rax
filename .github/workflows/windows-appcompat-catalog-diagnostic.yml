name: Windows installed AppCompat catalogs

on:
  push:
    branches: [validation/windows-appcompat-catalogs-20261123]

permissions:
  contents: read

jobs:
  native:
    name: AppCompat catalogs (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
          - { os: windows-2025, target: i686-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Keep temporary outputs in the worktree
        run: |
          mkdir -p .tmp-appcompat-catalogs
          native_tmp=$(cygpath -w "$PWD/.tmp-appcompat-catalogs")
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$native_tmp" "$native_tmp" "$native_tmp" >> "$GITHUB_ENV"
      - name: Select native Windows ARM64 Rust host
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: rustup set default-host aarch64-pc-windows-msvc
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.95.0
          cache-key: appcompat-catalogs-${{ matrix.target }}
      - name: Record installed AppPatch inputs
        shell: pwsh
        run: |
          [Environment]::OSVersion.VersionString
          "ProductType=" + (Get-CimInstance Win32_OperatingSystem).ProductType
          Get-FileHash -Algorithm SHA256 (Join-Path $env:SystemRoot 'System32\ntdll.dll')
          $appPatch = Join-Path $env:SystemRoot 'AppPatch'
          Get-ChildItem -Path (Join-Path $appPatch '*sysmain.sdb') -File | Get-FileHash -Algorithm SHA256
      - name: Compare installed candidates with native name flags
        run: |
          rustup target add "${{ matrix.target }}"
          rustc --edition 2024 --target "${{ matrix.target }}" \
            tests/fixtures/user/windows/src/native_appcompat_catalogs.rs \
            -o .tmp-appcompat-catalogs/native-appcompat-catalogs.exe
          .tmp-appcompat-catalogs/native-appcompat-catalogs.exe | tee .tmp-appcompat-catalogs/native.log
          grep -F 'summary ' .tmp-appcompat-catalogs/native.log
