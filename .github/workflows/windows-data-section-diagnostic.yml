name: Windows native data section diagnostic

on:
  push:
    branches: ['validation/windows-file-section-placeholder-*']

permissions:
  contents: read

jobs:
  native:
    name: File section placeholder (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Compare ordinary and exact native section mappings
        shell: pwsh
        run: |
          $scratch = Join-Path $env:GITHUB_WORKSPACE '.tmp-data-section'
          New-Item -ItemType Directory -Path $scratch | Out-Null
          $env:TMP = $scratch
          $env:TEMP = $scratch
          $env:TMPDIR = $scratch
          [Environment]::OSVersion.Version.ToString()
          Get-FileHash -Algorithm SHA256 (Join-Path $env:SystemRoot 'System32/kernelbase.dll')
          $src = 'tests/fixtures/user/windows/src/native_file_section_placeholder.rs'
          Get-FileHash -Algorithm SHA256 $src
          $probe = Join-Path $scratch 'native-file-section.exe'
          rustup run stable rustc --edition 2024 $src -o $probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rows = & $probe
          $probeExit = $LASTEXITCODE
          $rows
          if ($probeExit -ne 0) { exit $probeExit }
          if (@($rows | Where-Object { $_ -match '^section size=' }).Count -ne 36) {
            throw 'Expected 36 independent native observations'
          }
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.95.0
          cache-key: windows-userland-library-${{ matrix.os }}
      - name: Check file-section and installed RTL return behavior in RAX
        shell: pwsh
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_BUILD_JOBS: '2'
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: |
          $scratch = Join-Path $env:GITHUB_WORKSPACE '.tmp-data-section'
          $env:TMP = $scratch
          $env:TEMP = $scratch
          $env:TMPDIR = $scratch
          $names = @(
            'user::mm::windows_section::tests::file_section_memory_owner_survives_arena_drop_until_last_memory_clone',
            'user::windows::object_namespace::file_data::tests::native_imported_file_section_maps_the_final_partial_page',
            'user::windows::process::sched::tests::services_tests::processor_feature_tests::installed_processor_feature_query_leaf_and_rtl_read_guest_policy'
          )
          foreach ($name in $names) {
            $lines = cargo test --locked --no-default-features -p rax --lib -- $name --exact
            $testExit = $LASTEXITCODE
            $lines
            if ($testExit -ne 0) { exit $testExit }
            if (!($lines | Select-String -SimpleMatch 'test result: ok. 1 passed; 0 failed; 0 ignored')) {
              throw "Expected one passing test for $name"
            }
          }
