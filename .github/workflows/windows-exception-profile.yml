name: Native Windows exception entry profiles

on:
  push:
    branches: [master, main]
    paths:
      - .github/workflows/windows-exception-profile.yml
      - docs/specifications/windows/native-exception-entry-profile/**
      - docs/specifications/windows/native-raise-arguments/**
      - docs/specifications/windows/native-wow64-processor-feature/**
      - docs/specifications/windows/native-process-execute-flags/**
      - docs/specifications/windows/native-process-debug-port/**
      - docs/specifications/windows/native-process-image-information/**
      - docs/specifications/windows/native-wow64-startup-information/**
      - docs/specifications/windows/native-system-processor-information/**
      - docs/specifications/windows/native-system-flush-information/**
      - docs/specifications/windows/native-session-windows-directory/**
      - docs/specifications/windows/native-session-csr-connect/**
      - docs/specifications/windows/native-nls-amd64-initialize/**
      - docs/specifications/windows/native-wow64-csr-amd64/**
      - docs/specifications/windows/native-image-extension-amd64/**
      - docs/specifications/windows/native-file-write/**
      - docs/specifications/windows/native-mapped-filename/**
      - docs/specifications/windows/native-open-thread/**
      - docs/specifications/windows/native-memory-prefetch/**
      - docs/specifications/windows/native-primary-user-hive/**
      - docs/specifications/windows/native-open-key-ex/**
      - docs/specifications/windows/native-appmodel-registry/**
      - src/user/windows/process/sched/tests/services_tests/registry_key_open_ex*.rs
      - src/user/windows/process/sched/tests/services_tests/appmodel_registry_tests.rs
      - docs/specifications/windows/native-query-key/**
      - src/user/windows/dll/native/registry.rs
      - src/user/windows/dll/native/registry/**
      - src/user/windows/objects.rs
      - src/user/windows/process/sched/tests/services_tests/registry_key_query*.rs
      - src/user/windows/registry.rs
      - src/user/windows/registry/**
      - src/user/windows/native.rs
      - src/user/windows/process/sched/tests/services_tests/user_policy_registry_tests.rs
      - src/user/windows/dll/native/memory_prefetch.rs
      - src/user/windows/memory/prefetch.rs
      - src/user/windows/process/sched/tests/services_tests/memory_prefetch_tests.rs
      - src/user/windows/process/sched/tests/services_tests/memory_prefetch_tests/**
      - src/user/windows/dll/native/thread_open.rs
      - src/user/windows/security/thread.rs
      - src/user/windows/security/thread/**
      - src/user/windows/dll/threading.rs
      - src/user/windows/dll/threading/native_thread_open_resume_tests.rs
      - src/user/windows/process/sched/tests/services_tests/thread_open_tests.rs
      - src/user/windows/process/sched/tests/services_tests/thread_open_tests/**
      - src/bin/rax_user.rs
      - src/user/windows/dll/native/file_write.rs
      - tests/suites/user/windows/cli.rs
  pull_request:
    paths:
      - .github/workflows/windows-exception-profile.yml
      - docs/specifications/windows/native-exception-entry-profile/**
      - docs/specifications/windows/native-raise-arguments/**
      - docs/specifications/windows/native-wow64-processor-feature/**
      - docs/specifications/windows/native-process-execute-flags/**
      - docs/specifications/windows/native-process-debug-port/**
      - docs/specifications/windows/native-process-image-information/**
      - docs/specifications/windows/native-wow64-startup-information/**
      - docs/specifications/windows/native-system-processor-information/**
      - docs/specifications/windows/native-system-flush-information/**
      - docs/specifications/windows/native-session-windows-directory/**
      - docs/specifications/windows/native-session-csr-connect/**
      - docs/specifications/windows/native-nls-amd64-initialize/**
      - docs/specifications/windows/native-wow64-csr-amd64/**
      - docs/specifications/windows/native-image-extension-amd64/**
      - docs/specifications/windows/native-file-write/**
      - docs/specifications/windows/native-open-thread/**
      - docs/specifications/windows/native-memory-prefetch/**
      - docs/specifications/windows/native-primary-user-hive/**
      - docs/specifications/windows/native-open-key-ex/**
      - docs/specifications/windows/native-appmodel-registry/**
      - src/user/windows/process/sched/tests/services_tests/registry_key_open_ex*.rs
      - src/user/windows/process/sched/tests/services_tests/appmodel_registry_tests.rs
      - docs/specifications/windows/native-query-key/**
      - src/user/windows/dll/native/registry.rs
      - src/user/windows/dll/native/registry/**
      - src/user/windows/objects.rs
      - src/user/windows/process/sched/tests/services_tests/registry_key_query*.rs
      - src/user/windows/registry.rs
      - src/user/windows/registry/**
      - src/user/windows/native.rs
      - src/user/windows/process/sched/tests/services_tests/user_policy_registry_tests.rs
      - src/user/windows/dll/native/memory_prefetch.rs
      - src/user/windows/memory/prefetch.rs
      - src/user/windows/process/sched/tests/services_tests/memory_prefetch_tests.rs
      - src/user/windows/process/sched/tests/services_tests/memory_prefetch_tests/**
      - src/user/windows/dll/native/thread_open.rs
      - src/user/windows/security/thread.rs
      - src/user/windows/security/thread/**
      - src/user/windows/dll/threading.rs
      - src/user/windows/dll/threading/native_thread_open_resume_tests.rs
      - src/user/windows/process/sched/tests/services_tests/thread_open_tests.rs
      - src/user/windows/process/sched/tests/services_tests/thread_open_tests/**
      - src/bin/rax_user.rs
      - src/user/windows/dll/native/file_write.rs
      - tests/suites/user/windows/cli.rs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    name: Native exception entry (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Observe captured primary-user hive metadata and absence
        run: |
          python -B -m unittest discover -s docs/specifications/windows/native-primary-user-hive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B docs/specifications/windows/native-primary-user-hive/probe-v4.py --require-native-machine 0x8664 --output target/native-primary-user-hive-v4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve primary-user hive observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-primary-user-hive-${{ matrix.os }}
          path: target/native-primary-user-hive-v4
          if-no-files-found: error
      - name: Verify and observe native AppModel registry-view controls
        run: |
          python -B -m unittest discover -s docs/specifications/windows/native-appmodel-registry
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B docs/specifications/windows/native-appmodel-registry/run-v1.py --require-native-machine 0x8664 --output target/native-appmodel-registry-v1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native AppModel registry-view controls
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-appmodel-registry-${{ matrix.os }}
          path: |
            target/native-appmodel-registry-v1/receipt.json
            target/native-appmodel-registry-v1/**/*.log
            target/native-appmodel-registry-v1/**/*.jsonl
          if-no-files-found: error
      - name: Verify and observe native extended key opens
        run: |
          python -B -m unittest discover -s docs/specifications/windows/native-open-key-ex
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B docs/specifications/windows/native-open-key-ex/run-v3.py --require-native-machine 0x8664 --output target/native-open-key-order-v3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B docs/specifications/windows/native-open-key-ex/run-v5.py --require-native-machine 0x8664 --output target/native-open-key-grants-v5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B docs/specifications/windows/native-open-key-ex/run-v6.py --require-native-machine 0x8664 --output target/native-open-key-link-v6
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B docs/specifications/windows/native-open-key-ex/run-v7.py --require-native-machine 0x8664 --output target/native-open-key-views-v7
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native extended key-open observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-open-key-ex-${{ matrix.os }}
          path: |
            target/native-open-key-order-v3/receipt.json
            target/native-open-key-order-v3/**/*.log
            target/native-open-key-order-v3/**/*.jsonl
            target/native-open-key-grants-v5/receipt.json
            target/native-open-key-grants-v5/**/*.log
            target/native-open-key-grants-v5/**/*.jsonl
            target/native-open-key-link-v6/receipt.json
            target/native-open-key-link-v6/**/*.log
            target/native-open-key-link-v6/**/*.jsonl
            target/native-open-key-views-v7/receipt.json
            target/native-open-key-views-v7/**/*.log
            target/native-open-key-views-v7/**/*.jsonl
          if-no-files-found: error
      - name: Verify retained key-query artifact provenance
        run: python -B -m unittest discover -s docs/specifications/windows/native-query-key
      - name: Observe native AMD64 and WoW64 key queries
        run: python -B docs/specifications/windows/native-query-key/run-v3.py --require-native-machine 0x8664 --output target/native-query-key-v1
      - name: Preserve native key-query observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-query-key-${{ matrix.os }}
          path: |
            target/native-query-key-v1/receipt.json
            target/native-query-key-v1/**/*.log
            target/native-query-key-v1/**/*.jsonl
          if-no-files-found: error
      - name: Observe native AMD64 and WoW64 memory prefetch
        run: |
          New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'target') | Out-Null
          python -B docs/specifications/windows/native-memory-prefetch/run-v4.py --require-native-machine 0x8664 --output target/native-memory-prefetch-v4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native memory prefetch observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-memory-prefetch-${{ matrix.os }}
          path: target/native-memory-prefetch-v4
          if-no-files-found: error
      - name: Observe native AMD64 and WoW64 thread opening
        run: |
          New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'target') | Out-Null
          python -B docs/specifications/windows/native-open-thread/run-v6.py --require-native-machine 0x8664 --output target/native-open-thread-v6
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native thread opening observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-open-thread-${{ matrix.os }}
          path: target/native-open-thread-v6
          if-no-files-found: error
      - name: Observe native AMD64 and WoW64 mapped backing-file names
        run: |
          New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'target') | Out-Null
          python -B docs/specifications/windows/native-mapped-filename/run-amd64-v3.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Observe native resume-only and execute-grant consumers
        run: |
          python -B docs/specifications/windows/native-open-thread/run-resume-v1.py --require-native-machine 0x8664 --output target/native-thread-resume-v1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native thread grant consumer observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-thread-resume-${{ matrix.os }}
          path: target/native-thread-resume-v1
          if-no-files-found: error
      - name: Preserve early native mapped filename observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-mapped-filename-${{ matrix.os }}
          path: target/native-mapped-filename-amd64-v3
          if-no-files-found: error
      - name: Observe native AMD64 image-extension availability
        run: python -B docs/specifications/windows/native-image-extension-amd64/run-v1.py
      - name: Preserve native AMD64 image-extension observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-image-extension-amd64-${{ matrix.os }}
          path: target/native-image-extension-amd64-v1.json
          if-no-files-found: error
      - name: Observe native AMD64 type-1 image-extension query precedence
        run: python -B docs/specifications/windows/native-image-extension-amd64/run-query-matrix-v2.py
      - name: Preserve native AMD64 type-1 image-extension query observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-image-extension-amd64-query-matrix-${{ matrix.os }}
          path: target/native-image-extension-amd64-query-matrix-v2.json
          if-no-files-found: error
      - name: Observe independent AMD64 NLS initialization and view lifetime
        run: python -B docs/specifications/windows/native-nls-amd64-initialize/run-v1.py
      - name: Preserve independent AMD64 NLS observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-nls-amd64-initialize-${{ matrix.os }}
          path: target/native-nls-amd64-initialize-v1.json
          if-no-files-found: error
      - name: Observe current-session native CSR startup and readonly metadata
        run: python -B docs/specifications/windows/native-session-csr-connect/run-v3.py
      - name: Preserve current-session native CSR observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-session-csr-connect-${{ matrix.os }}
          path: target/native-session-csr-connect-v3.json
          if-no-files-found: error
      - name: Observe current-session Windows directory identities
        run: |
          python -B -m unittest discover -s docs/specifications/windows/native-session-windows-directory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B docs/specifications/windows/native-session-windows-directory/run-v2.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B docs/specifications/windows/native-session-windows-directory/verify.py target/native-session-windows-directory-v2.json
      - name: Preserve current-session Windows directory observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-session-windows-directory-${{ matrix.os }}
          path: target/native-session-windows-directory-v2.json
          if-no-files-found: error
      - name: Observe native system flush information
        run: |
          python -m unittest discover -s docs/specifications/windows/native-system-flush-information
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/specifications/windows/native-system-flush-information/run-v2.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/specifications/windows/native-system-flush-information/verify.py target/native-system-flush-information-v2.json
      - name: Preserve native system flush observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-system-flush-information-${{ matrix.os }}
          path: target/native-system-flush-information-v2.json
          if-no-files-found: error
      - name: Verify public instruction projection
        run: python docs/specifications/windows/native-exception-entry-profile/test_projection.py
      - name: Verify dispatcher observation projection
        run: |
          python docs/specifications/windows/native-exception-entry-profile/test_dispatch_projection.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/specifications/windows/native-exception-entry-profile/test_dispatch_contract.py
      - name: Observe native x64 and WoW64 exception frames
        run: python docs/specifications/windows/native-exception-entry-profile/run-v2.py
      - name: Observe owned child at native dispatcher entry
        run: python docs/specifications/windows/native-exception-entry-profile/run-dispatch-v4.py
      - name: Verify second-chance control results
        if: always()
        run: |
          python docs/specifications/windows/native-exception-entry-profile/test_second_chance.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/specifications/windows/native-exception-entry-profile/test_second_chance_diagnostics.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/specifications/windows/native-exception-entry-profile/test_second_chance_profiles.py
      - name: Observe second-chance delivery and invalid arguments
        if: always()
        run: python docs/specifications/windows/native-exception-entry-profile/run-second-chance-v6.py
      - name: Verify argument observation projection
        if: always()
        run: |
          python docs/specifications/windows/native-raise-arguments/test_projection.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/specifications/windows/native-raise-arguments/test_projection_v2.py
      - name: Observe native argument-copy and alignment order
        if: always()
        run: python docs/specifications/windows/native-raise-arguments/run-v2.py
      - name: Observe native WoW64 processor-feature service
        if: always()
        run: |
          python docs/specifications/windows/native-wow64-processor-feature/test_projection.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/specifications/windows/native-wow64-processor-feature/test_failure.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/specifications/windows/native-wow64-processor-feature/test_projection_v3.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/specifications/windows/native-wow64-processor-feature/run-v3.py
      - name: Observe readable exception argument alignment and partial extents
        if: always()
        run: |
          python docs/specifications/windows/native-exception-entry-profile/test_readable_alignment.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/specifications/windows/native-exception-entry-profile/run-second-chance-v5.py
      - name: Observe process execute flags without changing DEP policy
        if: always()
        run: |
          python docs/specifications/windows/native-process-execute-flags/test_projection.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/specifications/windows/native-process-execute-flags/run-v2.py
      - name: Observe process debug port without attaching a debugger
        if: always()
        run: |
          python docs/specifications/windows/native-process-debug-port/test_projection.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/specifications/windows/native-process-debug-port/run-v3.py
      - name: Observe process image information and independent PE metadata
        if: always()
        run: |
          python docs/specifications/windows/native-process-image-information/test_projection.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/specifications/windows/native-process-image-information/test_pointer_projection.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/specifications/windows/native-process-image-information/test_model_profiles.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/specifications/windows/native-process-image-information/run-v9.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/specifications/windows/native-process-image-information/run-relocation-directory-v1.py
      - name: Observe WoW64 companion TEB and shared startup information
        if: always()
        run: |
          python docs/specifications/windows/native-wow64-startup-information/test_projection.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/specifications/windows/native-wow64-startup-information/run-v2.py
      - name: Observe WoW64 startup section and quiescent work-list resources
        if: always()
        run: python docs/specifications/windows/native-wow64-startup-information/run-resources-v1.py
      - name: Observe native and compatibility processor information
        if: always()
        run: |
          python docs/specifications/windows/native-system-processor-information/test_projection.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/specifications/windows/native-system-processor-information/run-v1.py
      - name: Preserve native processor information observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-system-processor-information-${{ matrix.os }}
          path: target/native-system-processor-information-v1.json
          if-no-files-found: error
      - name: Observe original x86 CSR startup on independent AMD64 kernels
        if: always()
        run: python -B docs/specifications/windows/native-wow64-csr-amd64/run-v1.py
      - name: Preserve original AMD64 WoW64 CSR startup observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-wow64-csr-amd64-startup-${{ matrix.os }}
          path: target/native-wow64-csr-amd64-startup-v1.json
          if-no-files-found: error
      - name: Observe fresh and retry WoW64 CSR calls on independent AMD64 kernels
        if: always()
        run: |
          python -B -m unittest discover -s docs/specifications/windows/native-wow64-csr-amd64 -p test_matrix_projection.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B docs/specifications/windows/native-wow64-csr-amd64/run-matrix-v1.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B docs/specifications/windows/native-wow64-csr-amd64/project-matrix-v1.py target/native-wow64-csr-amd64-matrix-v1.json target/native-wow64-csr-amd64-matrix-projected-v1.json
      - name: Preserve independent AMD64 WoW64 CSR fresh and retry observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-wow64-csr-amd64-matrix-${{ matrix.os }}
          path: target/native-wow64-csr-amd64-matrix-v1.json
          if-no-files-found: error
      - name: Prepare contained native CSR build directories
        if: always()
        shell: pwsh
        run: |
          $csrTmp = Join-Path $env:GITHUB_WORKSPACE 'target/native-csr-build-tmp'
          New-Item -ItemType Directory -Force $csrTmp | Out-Null
          "TMPDIR=$csrTmp" >> $env:GITHUB_ENV
          "TMP=$csrTmp" >> $env:GITHUB_ENV
          "TEMP=$csrTmp" >> $env:GITHUB_ENV
          "RUSTC_WRAPPER=" >> $env:GITHUB_ENV
          "RUSTC_WORKSPACE_WRAPPER=" >> $env:GITHUB_ENV
      - uses: ./.github/actions/setup-rust
        if: always()
        with:
          toolchain: 1.95.0
          cache-key: native-csr-${{ matrix.os }}
      - name: Execute installed pure x86 CSR leaf on the native AMD64 kernel
        if: always()
        run: cargo test --locked --no-default-features --lib wow64_csr -- --nocapture --test-threads=1
      - name: Replay captured thread opens and execute installed NTDLL leaves
        if: always()
        run: |
