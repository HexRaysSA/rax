name: Native Windows exception entry profiles

on:
  push:
    branches: [master, main]
    paths:
      - .github/workflows/windows-exception-profile.yml
      - docs/specifications/windows/native-exception-entry-profile/**
      - docs/specifications/windows/native-raise-arguments/**
      - docs/specifications/windows/native-wow64-processor-feature/**
      - docs/specifications/windows/native-process-execute-flags/**
      - docs/specifications/windows/native-process-debug-port/**
  pull_request:
    paths:
      - .github/workflows/windows-exception-profile.yml
      - docs/specifications/windows/native-exception-entry-profile/**
      - docs/specifications/windows/native-raise-arguments/**
      - docs/specifications/windows/native-wow64-processor-feature/**
      - docs/specifications/windows/native-process-execute-flags/**
      - docs/specifications/windows/native-process-debug-port/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    name: Native exception entry (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Verify public instruction projection
        run: python docs/specifications/windows/native-exception-entry-profile/test_projection.py
      - name: Verify dispatcher observation projection
        run: |
          python docs/specifications/windows/native-exception-entry-profile/test_dispatch_projection.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/specifications/windows/native-exception-entry-profile/test_dispatch_contract.py
      - name: Observe native x64 and WoW64 exception frames
        run: python docs/specifications/windows/native-exception-entry-profile/run-v2.py
      - name: Observe owned child at native dispatcher entry
        run: python docs/specifications/windows/native-exception-entry-profile/run-dispatch-v4.py
      - name: Verify second-chance control results
        if: always()
        run: |
          python docs/specifications/windows/native-exception-entry-profile/test_second_chance.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/specifications/windows/native-exception-entry-profile/test_second_chance_diagnostics.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/specifications/windows/native-exception-entry-profile/test_second_chance_profiles.py
      - name: Observe second-chance delivery and invalid arguments
        if: always()
        run: python docs/specifications/windows/native-exception-entry-profile/run-second-chance-v6.py
      - name: Verify argument observation projection
        if: always()
        run: |
          python docs/specifications/windows/native-raise-arguments/test_projection.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/specifications/windows/native-raise-arguments/test_projection_v2.py
      - name: Observe native argument-copy and alignment order
        if: always()
        run: python docs/specifications/windows/native-raise-arguments/run-v2.py
      - name: Observe native WoW64 processor-feature service
        if: always()
        run: |
          python docs/specifications/windows/native-wow64-processor-feature/test_projection.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/specifications/windows/native-wow64-processor-feature/test_failure.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/specifications/windows/native-wow64-processor-feature/test_projection_v3.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/specifications/windows/native-wow64-processor-feature/run-v3.py
      - name: Observe readable exception argument alignment and partial extents
        if: always()
        run: |
          python docs/specifications/windows/native-exception-entry-profile/test_readable_alignment.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/specifications/windows/native-exception-entry-profile/run-second-chance-v5.py
      - name: Observe process execute flags without changing DEP policy
        if: always()
        run: |
          python docs/specifications/windows/native-process-execute-flags/test_projection.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/specifications/windows/native-process-execute-flags/run-v2.py
      - name: Observe process debug port without attaching a debugger
        if: always()
        run: |
          python docs/specifications/windows/native-process-debug-port/test_projection.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/specifications/windows/native-process-debug-port/run-v3.py
