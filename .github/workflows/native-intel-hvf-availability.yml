# SDK observations only; positive native RAX execution is a separate gate.
name: Native Intel HVF availability

on:
  workflow_dispatch:
    inputs:
      irq_vectoring:
        description: Run the isolated SDK interrupted-IRQ control
        type: boolean
        default: false
      cr0_ne:
        description: Run the isolated SDK CR0.NE read-shadow control
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  observe:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Observe signed native Intel HVF availability
        if: ${{ !inputs.irq_vectoring && !inputs.cr0_ne }}
        run: python3 tools/hvf/native_intel_availability.py --output "$RUNNER_TEMP/hvf-intel-availability"
      - name: Inspect native SDK VMCS field support
        if: ${{ !inputs.irq_vectoring && !inputs.cr0_ne }}
        run: python3 tools/hvf/intel_vmcs_native.py --output "$RUNNER_TEMP/hvf-intel-vmcs"
      - name: Observe SDK RAM entry control variants
        if: ${{ !inputs.irq_vectoring && !inputs.cr0_ne }}
        run: python3 tools/hvf/intel_ram_entry_native.py --constructor-matrix --output "$RUNNER_TEMP/hvf-intel-ram-entry"
      - name: Observe SDK DEBUGCTL access and branch stepping
        if: ${{ !inputs.irq_vectoring && !inputs.cr0_ne }}
        run: python3 tools/hvf/intel_debugctl_native.py --output "$RUNNER_TEMP/hvf-intel-debugctl"
      - name: Observe SDK VM-entry interrupt admission across a completed port exit
        if: ${{ !cancelled() && !inputs.irq_vectoring && !inputs.cr0_ne }}
        run: python3 tools/hvf/intel_nmi_entry_native.py --output "$RUNNER_TEMP/hvf-intel-nmi-entry"
      - name: Observe SDK IRQ delivery interrupted at the interrupt gate
        if: ${{ inputs.irq_vectoring }}
        run: >-
          python3 tools/hvf/intel_nmi_entry_native.py --irq-vectoring
          --output "$RUNNER_TEMP/hvf-intel-nmi-entry"
      - name: Observe SDK CR0.NE backing and guest read shadow
        if: ${{ inputs.cr0_ne }}
        run: >-
          python3 tools/hvf/intel_nmi_entry_native.py --cr0-ne
          --output "$RUNNER_TEMP/hvf-intel-cr0-ne"
      - name: Preserve host identity and SDK result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-intel-hvf-availability-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hvf-intel-availability
            ${{ runner.temp }}/hvf-intel-vmcs
            ${{ runner.temp }}/hvf-intel-ram-entry
            ${{ runner.temp }}/hvf-intel-debugctl
            ${{ runner.temp }}/hvf-intel-nmi-entry
            ${{ runner.temp }}/hvf-intel-cr0-ne
          if-no-files-found: error
