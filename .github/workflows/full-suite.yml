# Exhaustive validation of every SELF-CONTAINED test (no external oracle needed),
# sharded by test binary across parallel jobs, on every unix native platform
# (x64 + arm64 Linux, Intel + Apple-Silicon macOS).
#
# Taxonomy (so no job is a silent no-op):
#   * full-suite.yml (here)   - binaries that run with nothing installed, on all
#                               native OSes. The bulk of rax's correctness suite.
#   * differential.yml        - binaries that need QEMU/llvm-mc/clang (or are
#                               target_os="linux"-gated) -> Linux + toolchain.
#   * kvm.yml                 - binaries gated on `kvm` + /dev/kvm.
#
# Why shard by binary instead of cargo-nextest: nextest runs each test in its own
# process, and at ~124k tests the per-test spawn overhead dominates. Plain
# `cargo test` retains in-process parallelism for the host-independent corpus
# shards. The unit and SMIR-host shards execute raw native JIT mappings and
# verifier replays, so their individual harnesses are serialized while the
# matrix jobs remain parallel. (The genuinely heavy compiled test binaries —
# arm_diff / diff_fuzz / differential / the EVEX diff — live in the
# differential.yml and kvm.yml lanes; the big neon_gen / sve2_gen / arm32_gen
# files are data tables `include!`d by arm_diff*.rs, not standalone tests.)
#
# Runs nightly and on demand (far too heavy for every push; ci.yml is the gate).
name: Full suite

on:
  schedule:
    - cron: "0 6 * * *" # nightly 06:00 UTC
  workflow_dispatch:
    inputs:
      profile:
        description: "Cargo profile for the test build"
        type: choice
        default: dev
        options: [dev, release]

concurrency:
  group: full-suite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  full:
    name: ${{ matrix.platform.name }} / ${{ matrix.shard.name }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x64,   os: ubuntu-24.04,     features: "--no-default-features --features x86_64-suite,smir-jit" }
          - { name: linux-arm64, os: ubuntu-24.04-arm, features: "--no-default-features --features x86_64-suite,smir-jit" }
          - { name: macos-arm64, os: macos-15,         features: "--no-default-features --features x86_64-suite,smir-jit" }
          # macos-intel drops smir-jit: its x86_64 trampoline uses GNU-as directives Apple's assembler rejects.
          - { name: macos-intel, os: macos-15-intel,   features: "--no-default-features --features x86_64-suite" }
        shard:
          # unit tests + the self-contained boot / roundtrip / oracle binaries.
          - { name: unit,      tests: "--lib --test ci_actions_pinned --test smir_avx10_roundtrip --test isa_oracle --test ebpf_diff --test ebpf_smir_lift --test hexagon_bare_metal --test riscv_boot --test realmode_boot --test user_linux --test user_darwin --test user_windows", harness: "--include-ignored --test-threads=1 --nocapture" }
          # Backend fixtures and device owners; SDK parity executes on macOS.
          - { name: backend-devices, tests: "--features hvf --test hvf_sdk_abi --test hvf_xsetbv --test hvf_run_loop --test hvf_cr8 --test hvf_sync_exits --test hvf_event_injection --test hvf_interrupt_shadow --test hvf_port_io --test hvf_guest_translation --test hvf_mmio --test hvf_memory --test controller_irq --test hvf_controls --test nvme_prp --test nvme_sgl --test nvme_queues --test nvme_admission --test nvme_commands --test virtio_indirect --test virtio_ranges --test checkpoint_config --test ahci_dma --test storage_images --test storage_config --test controller_checkpoint --test pci_checkpoint --test pci_endpoint_checkpoint --test runtime_pci_checkpoint --test checkpoint_pci --test restore_admission --test checkpoint_physical_memory --test runtime_checkpoint_bundle --test checkpoint_resume --test checkpoint_cpus --test retirement_budget --test vm_timing --test retired_clock --test checkpoint_clock --test cortexm_dispatch --test retirement_clock --test x86_retired_tsc --test aarch64_step_jit --test counter_ticks --test hvf_arm64_state --test hvf_arm64_mmio --test riscv_hartid --test aarch64_affinity --test aarch64_cluster --test a32_fp_controls --test a32_fp_pairs --test x86_fault_retirement --bin rax", harness: "--test-threads=1 --nocapture" }
          # x86_64 instruction suite (host-independent: the emulator runs x86 on any host).
          - { name: x86_64,    tests: "--test x86_64 --test x86_64_paging --test x86_64_unimplemented_manifests", harness: "--include-ignored" }
          # AArch32 / generic ARM corpora. NOTE: neon_gen.rs / sve2_gen.rs /
          # arm32_gen.rs are pure data tables (`pub static ..._SWEEP`) with no
          # #[test] of their own — they are `include!`d by arm_diff*.rs and so are
          # exercised in differential.yml, NOT selectable as standalone `--test`s.
          - { name: arm,       tests: "--test arm --test arm_vfp_a32 --test aarch64_mmu --test asm_instructions", harness: "--include-ignored" }
          # Host-specific SMIR JIT binaries are cfg-gated internally: the x86
          # native/RISC-V-cross targets select their host backend internally;
          # AArch32/Thumb and x86-to-AArch64 targets run only on arm64.
          - { name: smir-host, tests: "--test smir_jit_vcpu --test smir_jit_evex_masking --test riscv_smir_x86_jit --test riscv_smir_aarch64_jit --test smir_jit_aarch32_aarch64 --test smir_jit_thumb_aarch64 --test smir_jit_x86_aarch64 --test aarch64_smir_native", harness: "--include-ignored --test-threads=1 --nocapture" }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          cache-key: full-${{ matrix.platform.name }}-${{ matrix.shard.name }}
      - name: cargo test (${{ matrix.shard.name }})
        shell: bash
        run: |
          profile_flag=""
          if [ "${{ inputs.profile }}" = "release" ]; then profile_flag="--release"; fi
          if [ "${{ matrix.shard.name }}" = "unit" ] || [ "${{ matrix.shard.name }}" = "smir-host" ]; then
            export RAX_JIT_TRACE=1
          fi
          cargo test $profile_flag ${{ matrix.platform.features }} ${{ matrix.shard.tests }} -- ${{ matrix.shard.harness }}

  # Doctests are not covered by the `--test <binary>` shards above.
  doctests:
    name: doctests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          cache-key: doctests
      - name: cargo test --doc
        run: cargo test --doc --no-default-features --features x86_64-suite,smir-jit
