          try {
            foreach ($producer in @('native-nls-initialize', 'native-nls-initialize-protection',
                                    'native-nls-initialize-leaf', 'native-nls-initialize-first-call')) {
              $source = Join-Path $sources "$producer.cpp"
              $exe = Join-Path $scratch "$producer.exe"
              $log = Join-Path $root "arm64-$producer.log"
              $sourceHash = (Get-FileHash -LiteralPath $source).Hash.ToLowerInvariant()
              & cl.exe /nologo /std:c++20 /MT /we4473 $source psapi.lib "/Fe:$exe"
              if ($LASTEXITCODE -ne 0) { throw "Native NLS producer $producer compilation failed" }
              $bytes = [System.IO.File]::ReadAllBytes($exe)
              $pe = [BitConverter]::ToInt32($bytes, 0x3c)
              if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0xAA64) {
                throw "Native NLS producer $producer has a foreign machine"
              }
              $probeHash = (Get-FileHash -LiteralPath $exe).Hash.ToLowerInvariant()
              & $exe | Set-Content -LiteralPath $log -Encoding utf8
              $exitCode = $LASTEXITCODE
              $identity.observations[$producer] = [ordered]@{
                source_sha256 = $sourceHash
                probe_sha256 = $probeHash
                log_sha256 = (Get-FileHash -LiteralPath $log).Hash.ToLowerInvariant()
                exit_code = $exitCode
                inputs_unchanged = (
                  $sourceHash -eq (Get-FileHash -LiteralPath $source).Hash.ToLowerInvariant() -and
                  $probeHash -eq (Get-FileHash -LiteralPath $exe).Hash.ToLowerInvariant()
                )
              }
              if ($exitCode -ne 0 -or !$identity.observations[$producer].inputs_unchanged -or
                  !(Select-String -LiteralPath $log -Pattern '^complete ' -Quiet)) {
                throw "Native NLS producer $producer did not complete"
              }
            }
          } finally {
            Pop-Location
            $identity.providers_unchanged = (
              $ntdllHash -eq (Get-FileHash -LiteralPath $ntdll).Hash.ToLowerInvariant() -and
              $localeHash -eq (Get-FileHash -LiteralPath $locale).Hash.ToLowerInvariant()
