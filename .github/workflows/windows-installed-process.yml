          $component = 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64'
          $expectedMachine = 0x8664
          if ($env:RAX_TEST_TARGET -eq 'aarch64-pc-windows-msvc') {
            $arch = 'arm64'
            $component = 'Microsoft.VisualStudio.Component.VC.Tools.ARM64'
            $expectedMachine = 0xAA64
          }
          $install = & $vswhere -latest -products '*' -requires $component -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$install) { throw "Visual Studio $arch compiler is unavailable" }
          Import-Module (Join-Path $install 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $install -SkipAutomaticLocation -DevCmdArguments "-arch=$arch -host_arch=$arch"
          $scratch = Join-Path $env:TMPDIR 'mui-query'
          New-Item -ItemType Directory -Path $scratch -Force | Out-Null
          $exe = Join-Path $scratch 'native-mui-query.exe'
