            target = $env:RAX_TEST_TARGET
            file_sha256 = $identities
            log_sha256 = (Get-FileHash -LiteralPath $log).Hash.ToLowerInvariant()
            exit_code = $exitCode
            inputs_unchanged = $unchanged
          }
          $identity | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'arm64-native-local-mapped-filename-identity.json') -Encoding utf8
          $completion = Select-String -LiteralPath $log -Pattern '^complete rows=(\d+)$'
          $rows = (Select-String -LiteralPath $log -Pattern '^row=').Count
          if ($exitCode -ne 0 -or !$unchanged -or $completion.Count -ne 1 -or
              $rows -lt 100 -or $rows -ne [int]$completion.Matches[0].Groups[1].Value) {
            throw 'Native ARM64 mapped-filename probe did not retain all observation rows'
          }
      - name: Preserve native process evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installed-process-${{ matrix.os }}-${{ github.sha }}
          path: |
            target/windows-installed-process/receipt.json
            target/windows-installed-process/capi.log
            target/windows-installed-process/child-capi.log
            target/windows-installed-process/native-child-apphelp.log
            target/windows-installed-process/native-child-apphelp-identity.json
            target/windows-installed-process/filter-receipt.json
            target/windows-installed-process/filter-capi.log
            target/windows-installed-process/native-token-duplicate.log
            target/windows-installed-process/native-token-duplicate-identity.json
            target/windows-installed-process/native-user-shape.log
            target/windows-installed-process/native-user-shape-identity.json
            target/windows-installed-process/amd64-user-request-shape.log
            target/windows-installed-process/amd64-user-request-identity.json
            target/windows-installed-process/amd64-legacy-gdi-init.log
            target/windows-installed-process/amd64-legacy-gdi-init-identity.json
            target/windows-installed-process/startup-license.json
            target/windows-installed-process/startup-license-identity.json
            target/windows-installed-process/native-mui-query.log
            target/windows-installed-process/native-mui-query-identity.json
            target/windows-installed-process/arm64-nls-initialize-identity.json
            target/windows-installed-process/arm64-native-nls-initialize*.log
            target/windows-installed-process/native-session-csr-connect-v3.json
            target/windows-installed-process/native-*-base-nls.log
            target/windows-installed-process/native-*-base-nls-identity.json
            target/windows-installed-process/arm64-native-local-mapped-filename.log
            target/windows-installed-process/arm64-native-local-mapped-filename-identity.json
          if-no-files-found: error
