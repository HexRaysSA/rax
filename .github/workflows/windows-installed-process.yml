name: Windows installed process

on:
  push:
    branches: [master, main]
    paths:
      - .github/workflows/windows-installed-process.yml
      - .github/actions/setup-rust/**
      - Cargo.toml
      - Cargo.lock
      - capi/**
      - src/**
      - vendor/vm-memory/**
  pull_request:
    paths:
      - .github/workflows/windows-installed-process.yml
      - .github/actions/setup-rust/**
      - Cargo.toml
      - Cargo.lock
      - capi/**
      - src/**
      - vendor/vm-memory/**
  workflow_dispatch:
    inputs:
      compare_installed_filter:
        description: Compare installed findstr.exe with redirected standard input
        type: boolean
        default: false
      compare_installed_child:
        description: Compare child process startup through installed cmd.exe
        type: boolean
        default: false
      trace_installed_child:
        description: Record guest NT service statuses during the installed child check
        type: boolean
        default: false
      measure_native_child_apphelp:
        description: Observe the native CMD child AppHelp requests and replies
        type: boolean
        default: false
      measure_native_csr_child:
        description: Observe native CMD child CSR registration
        type: boolean
        default: false
      measure_native_token_duplicate:
        description: Measure duplication of the test process's own token
        type: boolean
        default: false
      measure_native_user_shape:
        description: Measure fixed current-session USER connection geometry
        type: boolean
        default: false
      measure_native_user_request:
        description: Observe the installed AMD64 client USER request fields
        type: boolean
        default: false
      measure_legacy_gdi_init:
        description: Observe first legacy GDI initialization in an installed AMD64 child
        type: boolean
        default: false
      measure_startup_queries:
        description: Capture native startup license and MUI observations
        type: boolean
        default: false
      measure_arm64_nls_initialize:
        description: Capture native ARM64 NLS initialization behavior
        type: boolean
        default: false
      measure_arm64_csr:
        description: Capture native ARM64 current-session CSR startup
        type: boolean
        default: false
      measure_arm64_mui_registry:
        description: Observe native ARM64 MUI registry queries
        type: boolean
        default: false
      measure_arm64_mapped_filename:
        description: Observe native ARM64 mapped-filename output on installed local images
        type: boolean
        default: false
      measure_amd64_base_nls:
        description: Capture native AMD64 BASE NLS query replies
        type: boolean
        default: false
      measure_arm64_base_nls:
        description: Capture native ARM64 BASE NLS query replies
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-installed-process-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  native:
    name: Closed installed process (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Keep build temporaries in the worktree
        shell: pwsh
        run: |
          $scratch = Join-Path $env:GITHUB_WORKSPACE '.tmp-installed-process'
          New-Item -ItemType Directory -Path $scratch -Force | Out-Null
          @("TMPDIR=$scratch", "TMP=$scratch", "TEMP=$scratch") |
            Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
      - name: Observe native CMD child protocol
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.measure_native_child_apphelp || inputs.measure_native_csr_child) }}
        id: measure_child_apphelp
        shell: pwsh
        timeout-minutes: 12
        env:
          RAX_TEST_TARGET: ${{ matrix.target }}
          RAX_MEASURE_CSR_CHILD: ${{ inputs.measure_native_csr_child }}
        continue-on-error: true
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'target/windows-installed-process'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $csr = $env:RAX_MEASURE_CSR_CHILD -eq 'true'
          $probe = if ($csr) { 'native-child-csr' } else { 'native-child-apphelp' }
          $scratch = Join-Path $env:TMPDIR $probe
          New-Item -ItemType Directory -Path $scratch -Force | Out-Null
          $arm = $env:RAX_TEST_TARGET -eq 'aarch64-pc-windows-msvc'
          $arch = if ($arm) { 'arm64' } else { 'x64' }
          $effectiveArch = if ($arm) { 'arm64' } else { 'amd64' }
          $operation = if ($arm) { '@w0' } else { '@ecx' }
          $packet = if ($arm) { '@x1' } else { '@rdx' }
          $status = if ($arm) { '@w0' } else { '@eax' }
          $cdb = Join-Path ${env:ProgramFiles(x86)} "Windows Kits/10/Debuggers/$arch/cdb.exe"
          if (!(Test-Path -LiteralPath $cdb -PathType Leaf)) {
            $sdk = Get-ItemProperty 'HKLM:\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' |
              Where-Object { $_.DisplayName -match 'Windows Software Development Kit' -and
                             $_.DisplayVersion -like '10.1.26100.*' -and $_.BundleCachePath -and
                             (Test-Path -LiteralPath $_.BundleCachePath -PathType Leaf) } |
              Sort-Object DisplayVersion -Descending | Select-Object -First 1
            $installer = $sdk.BundleCachePath
            if (!$installer) {
              $installer = Join-Path $scratch 'winsdksetup.exe'
              Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2349110' -OutFile $installer
            }
            $sign = Get-AuthenticodeSignature -LiteralPath $installer
            if ($sign.Status -ne 'Valid' -or $sign.SignerCertificate.Subject -notmatch '(?:^|, )O=Microsoft Corporation(?:,|$)') {
              throw 'SDK installer signature could not be verified'
            }
            $installLog = Join-Path $scratch 'winsdksetup.log'
            $install = Start-Process -FilePath $installer -ArgumentList @(
              '/features', 'OptionId.WindowsDesktopDebuggers', '/q', '/norestart', '/log', ('"{0}"' -f $installLog)
            ) -PassThru -Wait
            if ($install.ExitCode -ne 0) { throw "SDK debugger component setup exited $($install.ExitCode)" }
          }
          if (!(Test-Path -LiteralPath $cdb -PathType Leaf)) { throw "Native $arch console debugger is unavailable" }

          $cmd = Join-Path $env:SystemRoot 'System32/cmd.exe'
          $ntdll = Join-Path $env:SystemRoot 'System32/ntdll.dll'
          $identity = [ordered]@{
            source_commit = $env:GITHUB_SHA
            kernel = [Environment]::OSVersion.Version.ToString()
            cmd_sha256 = (Get-FileHash -LiteralPath $cmd).Hash.ToLowerInvariant()
            ntdll_sha256 = (Get-FileHash -LiteralPath $ntdll).Hash.ToLowerInvariant()
            debugger_version = (Get-Item -LiteralPath $cdb).VersionInfo.ProductVersion
            target = $env:RAX_TEST_TARGET
          }
          if ($csr) {
            $api = if ($arm) { '@w2' } else { '@r8d' }
            $message = if ($arm) { '@x0' } else { '@rcx' }
            $capture = if ($arm) { '@x1' } else { '@rdx' }
            $length = if ($arm) { '@w3' } else { '@r9d' }
            $commands = @'
          .effmach %arch%
          bu0 ntdll!CsrClientCallServer ".if (%api% != 0x1001d) { gc }"
          g
          bc 0
          r $t0=%message%
          r $t1=%capture%
          .printf "\nRAX_CSR_ENTRY api=%x data_bytes=%x\n", %api%, %length%
          .if (@$t1 != 0) { .printf "\nRAX_CSR_CAPTURE bytes=%x pointers=%x\n", dwo(@$t1), dwo(@$t1+0x10) }
          .if (@$t1 != 0) { .if ((dwo(@$t1) >= 0x40) & (dwo(@$t1+0x10) == 4)) { .printf "\nRAX_CSR_OFFSETS %x %x %x %x\n", poi(@$t1+0x20)-@$t0, poi(@$t1+0x28)-@$t0, poi(@$t1+0x30)-@$t0, poi(@$t1+0x38)-@$t0 } }
          gu
          .printf "\nRAX_CSR_RETURN status=%x payload_bytes=%x message_bytes=%x operation=%x reply_status=%x\n", %status%, wo(@$t0), wo(@$t0+2), dwo(@$t0+0x30), dwo(@$t0+0x34)
          .if (wo(@$t0+2) == 0x258) { .printf "\nRAX_CSR_SXS flags=%x name_bytes=%x\n", dwo(@$t0+0x114), wo(@$t0+0x120) }
          g
          '@
            $commands = $commands.Replace('%arch%', $effectiveArch).Replace('%api%', $api).Replace('%message%', $message).Replace('%capture%', $capture).Replace('%length%', $length).Replace('%status%', $status)
            $raw = Join-Path $scratch 'debugger.log'
            $PSNativeCommandUseErrorActionPreference = $false
            $identity.session = (Get-Process -Id $PID).SessionId
            Set-Location -LiteralPath (Split-Path -Parent $cmd)
            $nativeOutput = @(& $cmd /d /c $cmd /d /c echo rax-child)
            $identity.native_match = $LASTEXITCODE -eq 0 -and ($nativeOutput -join [Environment]::NewLine).Trim() -ceq 'rax-child'
            $commands -split '\r?\n' | & $cdb -G -noshell -sins -netsyms:no -y $scratch $cmd /d /c $cmd /d /c echo rax-child 2>&1 |
              Set-Content -LiteralPath $raw -Encoding utf8
            $identity.debugger_exit = $LASTEXITCODE
            $identity.cmd_unchanged = $identity.cmd_sha256 -eq (Get-FileHash -LiteralPath $cmd).Hash.ToLowerInvariant()
            $identity.ntdll_unchanged = $identity.ntdll_sha256 -eq (Get-FileHash -LiteralPath $ntdll).Hash.ToLowerInvariant()
            $observations = @(Get-Content -LiteralPath $raw | Where-Object { $_ -cmatch '^RAX_CSR_(?:ENTRY|CAPTURE|OFFSETS|RETURN|SXS) [a-z0-9_= ]+$' })
            $identity.complete = [bool]($observations -match '^RAX_CSR_ENTRY api=1001d ') -and
              [bool]($observations -match '^RAX_CSR_RETURN status=0 ') -and $identity.native_match
            Set-Content -LiteralPath (Join-Path $root "$probe.log") -Value $observations -Encoding utf8
            $identity | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root "$probe-identity.json") -Encoding utf8
            $observations
            if ($identity.debugger_exit -ne 0 -or !$identity.complete -or !$identity.cmd_unchanged -or !$identity.ntdll_unchanged) {
              Get-Content -LiteralPath $raw |
                Select-String -Pattern 'syntax error|couldn.t resolve|memory access error|unable to read|no runnable' |
                Select-Object -First 8
              throw 'Native stock CMD CSR observation did not complete'
            }
            exit 0
          }
          $breakpoint = @'
          .effmach %arch%
          bu0 ntdll!NtApphelpCacheControl ".if (%operation% != 0n11) { gc }"
          '@
          $sample = @'
          g
          r $t0=%packet%
          r $t1=poi(@$t0+0x178)
          .printf "\nRAX_APPHELP_ENTRY mask=%x flags=%x name_bytes=%u capacity=%u\n", dwo(@$t0), dwo(@$t0+4), wo(@$t0+0x30), dwo(@$t0+0x180)
          gu
          .printf "\nRAX_APPHELP_RETURN status=%x bytes=%u\n", %status%, dwo(@$t0+0x180)
          .printf "\nRAX_APPHELP_DUMP_BEGIN\n"
          dd @$t1 L0n64
          .printf "\nRAX_APPHELP_DUMP_END\n"
          '@
          $breakpoint = $breakpoint.Replace('%arch%', $effectiveArch).Replace('%operation%', $operation)
          $sample = $sample.Replace('%packet%', $packet).Replace('%status%', $status)
          $lastSample = $sample.Replace('r $t0=', "bc 0`nr " + '$t0=')
          $commands = if ($arm) { @($breakpoint, $sample, $lastSample, 'g') } else { @($breakpoint, $lastSample, 'g') }
          $commands = $commands -join "`n"
          $raw = Join-Path $scratch 'debugger.log'
          $PSNativeCommandUseErrorActionPreference = $false
          Set-Location -LiteralPath (Split-Path -Parent $cmd)
          $commands -split '\r?\n' | & $cdb -G -noshell -sins -netsyms:no -y $scratch $cmd /d /c $cmd /d /c echo rax-child 2>&1 |
            Set-Content -LiteralPath $raw -Encoding utf8
          $identity.debugger_exit = $LASTEXITCODE
          $identity.cmd_unchanged = $identity.cmd_sha256 -eq (Get-FileHash -LiteralPath $cmd).Hash.ToLowerInvariant()
          $identity.ntdll_unchanged = $identity.ntdll_sha256 -eq (Get-FileHash -LiteralPath $ntdll).Hash.ToLowerInvariant()
          $summary = Join-Path $root 'native-child-apphelp.log'
          $size = 0
          $words = [System.Collections.Generic.List[string]]::new()
          $dump = $false
          $completed = 0
          $nativeOutput = $false
          $observations = foreach ($line in Get-Content -LiteralPath $raw) {
            if ($line -match '^RAX_APPHELP_ENTRY mask=1f flags=[0-9a-f]+ name_bytes=\d+ capacity=4096$') {
              $line
              continue
            }
            if ($line -match '^RAX_APPHELP_RETURN status=([0-9a-f]+) bytes=(\d+)$') {
              $size = if ($Matches[1] -eq '0') { [int]$Matches[2] } else { 0 }
              $line
              continue
            }
            if ($line -match '^RAX_APPHELP_DUMP_BEGIN$') {
              $words.Clear()
              $dump = $true
              continue
            }
            if ($line -match '^RAX_APPHELP_DUMP_END$') {
              $dump = $false
              if ($size -gt 0 -and $size -le 256 -and ($size % 4) -eq 0 -and $words.Count -ge ($size / 4)) {
                for ($i = 0; $i -lt ($size / 4); $i++) {
                  "RAX_APPHELP_WORD offset=$($i * 4) value=$($words[$i])"
                }
                $completed++
              }
              continue
            }
            if ($dump -and $line -match '(?:^|>\s*)[0-9a-f]{8}(?:`[0-9a-f]{8})?\s+((?:[0-9a-f]{8}\s+){0,3}[0-9a-f]{8})\s*$') {
              $words.AddRange([string[]]($Matches[1] -split '\s+'))
              continue
            }
            if ($line -match '^rax-child\s*$') {
              $nativeOutput = $true
              'rax-child'
            }
          }
          Set-Content -LiteralPath $summary -Value @($observations) -Encoding utf8
          $identity.complete = $nativeOutput -and $completed -gt 0
          $identity.completed_replies = $completed
          $identity | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'native-child-apphelp-identity.json') -Encoding utf8
          if ($identity.debugger_exit -ne 0 -or !$identity.complete -or !$identity.cmd_unchanged -or !$identity.ntdll_unchanged) {
            Get-Content -LiteralPath $summary
            Get-Content -LiteralPath $raw |
              Select-String -Pattern 'syntax error|couldn.t resolve|memory access error|unable to read|no runnable' |
              Select-Object -First 8
            throw 'Native stock CMD AppHelp observation did not complete'
          }
          Get-Content -LiteralPath $summary
      - name: Preserve native CMD child observation
        if: ${{ !cancelled() && steps.measure_child_apphelp.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-child-${{ inputs.measure_native_csr_child && 'csr' || 'apphelp' }}-${{ matrix.os }}-${{ github.sha }}
          path: |
            target/windows-installed-process/native-child-${{ inputs.measure_native_csr_child && 'csr' || 'apphelp' }}.log
            target/windows-installed-process/native-child-${{ inputs.measure_native_csr_child && 'csr' || 'apphelp' }}-identity.json
      - name: Select native Windows ARM64 Rust host
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: rustup set default-host aarch64-pc-windows-msvc
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
          cache-key: windows-installed-process-${{ matrix.os }}
      - name: Compare installed cmd.exe through the closed C ABI
        id: stock
        shell: pwsh
        env:
          RAX_TEST_TARGET: ${{ matrix.target }}
          RAX_TEST_WINDOWS_NTSTATUS: ${{ github.event_name == 'workflow_dispatch' && inputs.trace_installed_child }}
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:GITHUB_WORKSPACE 'target'
          $root = Join-Path $env:CARGO_TARGET_DIR 'windows-installed-process'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $test = 'tests::process::native_runtime::installed_cmd_ver_matches_native_through_closed_c_abi'
          $ntdll = Join-Path $env:SystemRoot 'System32/ntdll.dll'
          $cmd = Join-Path $env:SystemRoot 'System32/cmd.exe'
          $receipt = [ordered]@{
            source_commit = $env:GITHUB_SHA
            kernel = [Environment]::OSVersion.Version.ToString()
            target = $env:RAX_TEST_TARGET
            test = $test
            ntdll_sha256 = (Get-FileHash -LiteralPath $ntdll).Hash.ToLowerInvariant()
            cmd_sha256 = (Get-FileHash -LiteralPath $cmd).Hash.ToLowerInvariant()
          }
          $receiptPath = Join-Path $root 'receipt.json'
          $receipt | ConvertTo-Json | Set-Content -LiteralPath $receiptPath -Encoding utf8
          $log = Join-Path $root 'capi.log'
          $PSNativeCommandUseErrorActionPreference = $false
          cargo test --locked --no-default-features -p rax-capi --lib --target $env:RAX_TEST_TARGET `
            $test -- --exact --ignored --nocapture 2>&1 | Tee-Object -FilePath $log
          $receipt.exit_code = $LASTEXITCODE
          $receipt.completed_one_test = Select-String -LiteralPath $log -Quiet -Pattern '^test result: ok\. 1 passed; 0 failed; 0 ignored;'
          $receipt.installed_images_unchanged = (
            $receipt.ntdll_sha256 -eq (Get-FileHash -LiteralPath $ntdll).Hash.ToLowerInvariant() -and
            $receipt.cmd_sha256 -eq (Get-FileHash -LiteralPath $cmd).Hash.ToLowerInvariant()
          )
          $receipt | ConvertTo-Json | Set-Content -LiteralPath $receiptPath -Encoding utf8
          if ($receipt.exit_code -ne 0 -or !$receipt.completed_one_test -or !$receipt.installed_images_unchanged) {
            exit 1
          }
      - name: Compare installed cmd.exe reads and writes through NUL
        if: steps.stock.outcome == 'success'
        shell: pwsh
        env:
          RAX_TEST_TARGET: ${{ matrix.target }}
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:GITHUB_WORKSPACE 'target'
          $root = Join-Path $env:CARGO_TARGET_DIR 'windows-installed-process'
          $test = 'tests::process::native_runtime::installed_cmd_null_device_matches_native_through_closed_c_abi'
          $log = Join-Path $root 'null-capi.log'
          $PSNativeCommandUseErrorActionPreference = $false
          cargo test --locked --no-default-features -p rax-capi --lib --target $env:RAX_TEST_TARGET `
            $test -- --exact --ignored --nocapture 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0 -or
              !(Select-String -LiteralPath $log -Quiet -Pattern '^test result: ok\. 1 passed; 0 failed; 0 ignored;')) {
            exit 1
          }
      - name: Compare an installed child process through the closed C ABI
        if: ${{ !cancelled() && steps.stock.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.compare_installed_child) }}
        shell: pwsh
        env:
          RAX_TEST_TARGET: ${{ matrix.target }}
          RAX_TEST_WINDOWS_NTSTATUS: ${{ github.event_name == 'workflow_dispatch' && inputs.trace_installed_child }}
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:GITHUB_WORKSPACE 'target'
          $root = Join-Path $env:CARGO_TARGET_DIR 'windows-installed-process'
          $test = 'tests::process::native_runtime::installed_cmd_child_matches_native_through_closed_c_abi'
          $log = Join-Path $root 'child-capi.log'
          $PSNativeCommandUseErrorActionPreference = $false
          cargo test --locked --no-default-features -p rax-capi --lib --target $env:RAX_TEST_TARGET `
            $test -- --exact --ignored --nocapture 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0 -or
              !(Select-String -LiteralPath $log -Quiet -Pattern '^test result: ok\. 1 passed; 0 failed; 0 ignored;')) {
            exit 1
          }
      - name: Observe duplication of the native test process token
        if: ${{ !cancelled() && inputs.measure_native_token_duplicate && steps.stock.outcome != 'skipped' }}
        shell: pwsh
        env:
          RAX_TEST_TARGET: ${{ matrix.target }}
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:GITHUB_WORKSPACE 'target'
          $root = Join-Path $env:CARGO_TARGET_DIR 'windows-installed-process'
          $test = 'tests::process::native_runtime::token_duplicate::installed_current_subject_duplicate_matches_guest_request'
          $source = Join-Path $env:GITHUB_WORKSPACE 'capi/src/tests/process/native_runtime/token_duplicate.rs'
          $ntdll = Join-Path $env:SystemRoot 'System32/ntdll.dll'
          $log = Join-Path $root 'native-token-duplicate.log'
          $sourceHash = (Get-FileHash -LiteralPath $source).Hash.ToLowerInvariant()
          $ntdllHash = (Get-FileHash -LiteralPath $ntdll).Hash.ToLowerInvariant()
          $PSNativeCommandUseErrorActionPreference = $false
          cargo test --locked --no-default-features -p rax-capi --lib --target $env:RAX_TEST_TARGET `
            $test -- --exact --ignored --nocapture 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          $unchanged = (
            $sourceHash -eq (Get-FileHash -LiteralPath $source).Hash.ToLowerInvariant() -and
            $ntdllHash -eq (Get-FileHash -LiteralPath $ntdll).Hash.ToLowerInvariant()
          )
          [ordered]@{
            source_commit = $env:GITHUB_SHA
            kernel = [Environment]::OSVersion.Version.ToString()
            target = $env:RAX_TEST_TARGET
            source_sha256 = $sourceHash
            ntdll_sha256 = $ntdllHash
            log_sha256 = (Get-FileHash -LiteralPath $log).Hash.ToLowerInvariant()
            inputs_unchanged = $unchanged
            exit_code = $exitCode
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'native-token-duplicate-identity.json') -Encoding utf8
          if ($exitCode -ne 0 -or !$unchanged -or
              !(Select-String -LiteralPath $log -Pattern '^test result: ok\. 1 passed; 0 failed; 0 ignored;' -Quiet) -or
              !(Select-String -LiteralPath $log -Pattern '^native duplicate complete: ' -Quiet)) {
            throw 'Native current-process token duplication control did not pass'
          }
      - name: Compare installed findstr.exe through the closed C ABI
        if: ${{ !cancelled() && steps.stock.outcome != 'skipped' && (github.event_name != 'workflow_dispatch' || inputs.compare_installed_filter) }}
        shell: pwsh
        env:
          RAX_TEST_TARGET: ${{ matrix.target }}
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:GITHUB_WORKSPACE 'target'
          $root = Join-Path $env:CARGO_TARGET_DIR 'windows-installed-process'
          $test = 'tests::process::native_runtime::installed_findstr_matches_native_through_closed_c_abi'
          $ntdll = Join-Path $env:SystemRoot 'System32/ntdll.dll'
          $findstr = Join-Path $env:SystemRoot 'System32/findstr.exe'
          $receipt = [ordered]@{
            source_commit = $env:GITHUB_SHA
            kernel = [Environment]::OSVersion.Version.ToString()
            target = $env:RAX_TEST_TARGET
            test = $test
            ntdll_sha256 = (Get-FileHash -LiteralPath $ntdll).Hash.ToLowerInvariant()
            findstr_sha256 = (Get-FileHash -LiteralPath $findstr).Hash.ToLowerInvariant()
          }
          $receiptPath = Join-Path $root 'filter-receipt.json'
          $receipt | ConvertTo-Json | Set-Content -LiteralPath $receiptPath -Encoding utf8
          $log = Join-Path $root 'filter-capi.log'
          $PSNativeCommandUseErrorActionPreference = $false
          cargo test --locked --no-default-features -p rax-capi --lib --target $env:RAX_TEST_TARGET `
            $test -- --exact --ignored --nocapture 2>&1 | Tee-Object -FilePath $log
          $receipt.exit_code = $LASTEXITCODE
          $receipt.completed_one_test = Select-String -LiteralPath $log -Quiet -Pattern '^test result: ok\. 1 passed; 0 failed; 0 ignored;'
          $receipt.installed_images_unchanged = (
            $receipt.ntdll_sha256 -eq (Get-FileHash -LiteralPath $ntdll).Hash.ToLowerInvariant() -and
            $receipt.findstr_sha256 -eq (Get-FileHash -LiteralPath $findstr).Hash.ToLowerInvariant()
          )
          $receipt | ConvertTo-Json | Set-Content -LiteralPath $receiptPath -Encoding utf8
          if ($receipt.exit_code -ne 0 -or !$receipt.completed_one_test -or !$receipt.installed_images_unchanged) {
            exit 1
          }
      - name: Measure the native USER connection geometry
