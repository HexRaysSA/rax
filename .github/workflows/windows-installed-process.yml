      - name: Measure native MUI registry queries
        if: ${{ !cancelled() && steps.stock.outcome != 'skipped' && ((inputs.measure_startup_queries && matrix.target == 'x86_64-pc-windows-msvc') || (inputs.measure_arm64_mui_registry && matrix.target == 'aarch64-pc-windows-msvc')) }}
        shell: pwsh
