name: Windows installed process

on:
  push:
    branches: [master, main]
    paths:
      - .github/workflows/windows-installed-process.yml
      - .github/actions/setup-rust/**
      - Cargo.toml
      - Cargo.lock
      - capi/**
      - src/**
      - vendor/vm-memory/**
  pull_request:
    paths:
      - .github/workflows/windows-installed-process.yml
      - .github/actions/setup-rust/**
      - Cargo.toml
      - Cargo.lock
      - capi/**
      - src/**
      - vendor/vm-memory/**
  workflow_dispatch:
    inputs:
      compare_installed_filter:
        description: Compare installed findstr.exe with redirected standard input
        type: boolean
        default: false
      measure_native_user_shape:
        description: Measure fixed current-session USER connection geometry
        type: boolean
        default: false
      measure_startup_queries:
        description: Capture native startup license and MUI observations
        type: boolean
        default: false
      measure_arm64_nls_initialize:
        description: Capture native ARM64 NLS initialization behavior
        type: boolean
        default: false
      measure_arm64_csr:
        description: Capture native ARM64 current-session CSR startup
        type: boolean
        default: false
      measure_arm64_mui_registry:
        description: Observe native ARM64 MUI registry queries
        type: boolean
        default: false
      measure_arm64_mapped_filename:
        description: Observe native ARM64 mapped-filename output on installed local images
        type: boolean
        default: false
      measure_amd64_base_nls:
        description: Capture native AMD64 BASE NLS query replies
        type: boolean
        default: false
      measure_arm64_base_nls:
        description: Capture native ARM64 BASE NLS query replies
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-installed-process-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  native:
    name: Closed installed process (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Keep build temporaries in the worktree
        shell: pwsh
        run: |
          $scratch = Join-Path $env:GITHUB_WORKSPACE '.tmp-installed-process'
          New-Item -ItemType Directory -Path $scratch -Force | Out-Null
          @("TMPDIR=$scratch", "TMP=$scratch", "TEMP=$scratch") |
            Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
      - name: Select native Windows ARM64 Rust host
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: rustup set default-host aarch64-pc-windows-msvc
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
          cache-key: windows-installed-process-${{ matrix.os }}
      - name: Compare installed cmd.exe through the closed C ABI
        id: stock
        shell: pwsh
        env:
          RAX_TEST_TARGET: ${{ matrix.target }}
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:GITHUB_WORKSPACE 'target'
          $root = Join-Path $env:CARGO_TARGET_DIR 'windows-installed-process'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $test = 'tests::process::native_runtime::installed_cmd_ver_matches_native_through_closed_c_abi'
          $ntdll = Join-Path $env:SystemRoot 'System32/ntdll.dll'
          $cmd = Join-Path $env:SystemRoot 'System32/cmd.exe'
          $receipt = [ordered]@{
            source_commit = $env:GITHUB_SHA
            kernel = [Environment]::OSVersion.Version.ToString()
            target = $env:RAX_TEST_TARGET
            test = $test
            ntdll_sha256 = (Get-FileHash -LiteralPath $ntdll).Hash.ToLowerInvariant()
            cmd_sha256 = (Get-FileHash -LiteralPath $cmd).Hash.ToLowerInvariant()
          }
          $receiptPath = Join-Path $root 'receipt.json'
          $receipt | ConvertTo-Json | Set-Content -LiteralPath $receiptPath -Encoding utf8
          $log = Join-Path $root 'capi.log'
          $PSNativeCommandUseErrorActionPreference = $false
          cargo test --locked --no-default-features -p rax-capi --lib --target $env:RAX_TEST_TARGET `
            $test -- --exact --ignored --nocapture 2>&1 | Tee-Object -FilePath $log
          $receipt.exit_code = $LASTEXITCODE
          $receipt.completed_one_test = Select-String -LiteralPath $log -Quiet -Pattern '^test result: ok\. 1 passed; 0 failed; 0 ignored;'
          $receipt.installed_images_unchanged = (
            $receipt.ntdll_sha256 -eq (Get-FileHash -LiteralPath $ntdll).Hash.ToLowerInvariant() -and
            $receipt.cmd_sha256 -eq (Get-FileHash -LiteralPath $cmd).Hash.ToLowerInvariant()
          )
          $receipt | ConvertTo-Json | Set-Content -LiteralPath $receiptPath -Encoding utf8
          if ($receipt.exit_code -ne 0 -or !$receipt.completed_one_test -or !$receipt.installed_images_unchanged) {
            exit 1
          }
      - name: Compare installed findstr.exe through the closed C ABI
        if: ${{ !cancelled() && inputs.compare_installed_filter && steps.stock.outcome != 'skipped' }}
        shell: pwsh
        env:
          RAX_TEST_TARGET: ${{ matrix.target }}
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:GITHUB_WORKSPACE 'target'
          $root = Join-Path $env:CARGO_TARGET_DIR 'windows-installed-process'
          $test = 'tests::process::native_runtime::installed_findstr_matches_native_through_closed_c_abi'
          $ntdll = Join-Path $env:SystemRoot 'System32/ntdll.dll'
          $findstr = Join-Path $env:SystemRoot 'System32/findstr.exe'
          $receipt = [ordered]@{
            source_commit = $env:GITHUB_SHA
            kernel = [Environment]::OSVersion.Version.ToString()
            target = $env:RAX_TEST_TARGET
            test = $test
            ntdll_sha256 = (Get-FileHash -LiteralPath $ntdll).Hash.ToLowerInvariant()
            findstr_sha256 = (Get-FileHash -LiteralPath $findstr).Hash.ToLowerInvariant()
          }
          $receiptPath = Join-Path $root 'filter-receipt.json'
          $receipt | ConvertTo-Json | Set-Content -LiteralPath $receiptPath -Encoding utf8
          $log = Join-Path $root 'filter-capi.log'
          $PSNativeCommandUseErrorActionPreference = $false
          cargo test --locked --no-default-features -p rax-capi --lib --target $env:RAX_TEST_TARGET `
            $test -- --exact --ignored --nocapture 2>&1 | Tee-Object -FilePath $log
          $receipt.exit_code = $LASTEXITCODE
          $receipt.completed_one_test = Select-String -LiteralPath $log -Quiet -Pattern '^test result: ok\. 1 passed; 0 failed; 0 ignored;'
          $receipt.installed_images_unchanged = (
            $receipt.ntdll_sha256 -eq (Get-FileHash -LiteralPath $ntdll).Hash.ToLowerInvariant() -and
            $receipt.findstr_sha256 -eq (Get-FileHash -LiteralPath $findstr).Hash.ToLowerInvariant()
          )
          $receipt | ConvertTo-Json | Set-Content -LiteralPath $receiptPath -Encoding utf8
          if ($receipt.exit_code -ne 0 -or !$receipt.completed_one_test -or !$receipt.installed_images_unchanged) {
            exit 1
          }
      - name: Measure the native USER connection geometry
        if: ${{ !cancelled() && inputs.measure_native_user_shape && steps.stock.outcome != 'skipped' }}
        shell: pwsh
        env:
          RAX_TEST_TARGET: ${{ matrix.target }}
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'target/windows-installed-process'
          $source = Join-Path $env:GITHUB_WORKSPACE 'docs/specifications/windows/native-alpc-csr/fixed-user-shape.rs'
          $exe = Join-Path $env:TMPDIR 'fixed-user-shape.exe'
          $log = Join-Path $root 'native-user-shape.log'
          $ntdll = Join-Path $env:SystemRoot 'System32/ntdll.dll'
          $sourceHash = (Get-FileHash -LiteralPath $source).Hash.ToLowerInvariant()
          $ntdllHash = (Get-FileHash -LiteralPath $ntdll).Hash.ToLowerInvariant()
          rustc --edition 2024 -Dwarnings --target $env:RAX_TEST_TARGET $source -o $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exeHash = (Get-FileHash -LiteralPath $exe).Hash.ToLowerInvariant()
          $PSNativeCommandUseErrorActionPreference = $false
          $kernel = [Environment]::OSVersion.Version
          $userBytes = if ($env:RAX_TEST_TARGET -eq 'x86_64-pc-windows-msvc' -and
              $kernel.Build -eq 20348) { 576 } else { 584 }
          & $exe $userBytes 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          $identity = [ordered]@{
            source_commit = $env:GITHUB_SHA
            kernel = [Environment]::OSVersion.Version.ToString()
            target = $env:RAX_TEST_TARGET
            information_bytes = $userBytes
            source_sha256 = $sourceHash
            ntdll_sha256 = $ntdllHash
            exe_sha256 = $exeHash
            exit_code = $exitCode
            log_sha256 = (Get-FileHash -LiteralPath $log).Hash.ToLowerInvariant()
            inputs_unchanged = (
              $sourceHash -eq (Get-FileHash -LiteralPath $source).Hash.ToLowerInvariant() -and
              $ntdllHash -eq (Get-FileHash -LiteralPath $ntdll).Hash.ToLowerInvariant() -and
              $exeHash -eq (Get-FileHash -LiteralPath $exe).Hash.ToLowerInvariant()
            )
          }
          $identity | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'native-user-shape-identity.json') -Encoding utf8
          if ($identity.exit_code -ne 0 -or !$identity.inputs_unchanged -or
              !(Select-String -LiteralPath $log -Pattern '^complete samples=2$' -Quiet)) {
            throw 'Native USER connection observations did not complete'
          }
      - name: Measure the native startup license queries
        if: ${{ !cancelled() && inputs.measure_startup_queries && steps.stock.outcome != 'skipped' }}
        shell: pwsh
        env:
          RAX_TEST_TARGET: ${{ matrix.target }}
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'target/windows-installed-process'
          $source = Join-Path $env:GITHUB_WORKSPACE 'docs/specifications/windows/native-startup-license/probe-native64.rs'
          $exe = Join-Path $env:TMPDIR 'startup-license-probe.exe'
          $data = Join-Path $root 'startup-license.json'
          rustc --edition 2024 --target $env:RAX_TEST_TARGET $source -o $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ntdll = Join-Path $env:SystemRoot 'System32/ntdll.dll'
          $native = (Get-FileHash -LiteralPath $ntdll).Hash.ToLowerInvariant()
          & $exe | Set-Content -LiteralPath $data -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content -Raw -LiteralPath $data | ConvertFrom-Json
          if ($result.rows.Count -ne 80) { throw 'Expected 80 native startup license observations' }
          $identity = [ordered]@{
            source_commit = $env:GITHUB_SHA
            source_sha256 = (Get-FileHash -LiteralPath $source).Hash.ToLowerInvariant()
            probe_sha256 = (Get-FileHash -LiteralPath $exe).Hash.ToLowerInvariant()
            ntdll_sha256 = $native
            ntdll_unchanged = $native -eq (Get-FileHash -LiteralPath $ntdll).Hash.ToLowerInvariant()
          }
          $identity | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'startup-license-identity.json') -Encoding utf8
          if (!$identity.ntdll_unchanged) { throw 'Native ntdll changed during measurement' }
      - name: Measure native MUI registry queries
        if: ${{ !cancelled() && steps.stock.outcome != 'skipped' && ((inputs.measure_startup_queries && matrix.target == 'x86_64-pc-windows-msvc') || (inputs.measure_arm64_mui_registry && matrix.target == 'aarch64-pc-windows-msvc')) }}
        shell: pwsh
        env:
          RAX_TEST_TARGET: ${{ matrix.target }}
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'target/windows-installed-process'
          $source = Join-Path $env:GITHUB_WORKSPACE 'docs/specifications/windows/native-mui-query/native-mui-query-v2.cpp'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $arch = 'x64'
          $component = 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64'
          $expectedMachine = 0x8664
          if ($env:RAX_TEST_TARGET -eq 'aarch64-pc-windows-msvc') {
            $arch = 'arm64'
            $component = 'Microsoft.VisualStudio.Component.VC.Tools.ARM64'
            $expectedMachine = 0xAA64
          }
          $install = & $vswhere -latest -products '*' -requires $component -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$install) { throw "Visual Studio $arch compiler is unavailable" }
          Import-Module (Join-Path $install 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $install -SkipAutomaticLocation -DevCmdArguments "-arch=$arch -host_arch=$arch"
          $scratch = Join-Path $env:TMPDIR 'mui-query'
          New-Item -ItemType Directory -Path $scratch -Force | Out-Null
          $exe = Join-Path $scratch 'native-mui-query.exe'
          $ntdll = Join-Path $env:SystemRoot 'System32/ntdll.dll'
          $native = (Get-FileHash -LiteralPath $ntdll).Hash.ToLowerInvariant()
          $log = Join-Path $root 'native-mui-query.log'
          $sourceHash = (Get-FileHash -LiteralPath $source).Hash.ToLowerInvariant()
          Push-Location -LiteralPath $scratch
          try {
            & cl.exe /nologo /EHsc /std:c++17 "/Fe$exe" $source
            if ($LASTEXITCODE -ne 0) { throw "MUI probe compilation failed with exit code $LASTEXITCODE" }
            $pe = [IO.File]::ReadAllBytes($exe)
            $peOffset = [BitConverter]::ToInt32($pe, 0x3C)
            $machine = [BitConverter]::ToUInt16($pe, $peOffset + 4)
            if ($machine -ne $expectedMachine) { throw "MUI probe did not compile for native $arch" }
            $probeHash = (Get-FileHash -LiteralPath $exe).Hash.ToLowerInvariant()
            & $exe | Set-Content -LiteralPath $log -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw "MUI probe failed with exit code $LASTEXITCODE" }
            $payload = Join-Path $scratch 'mui.bin'
            if ((Select-String -LiteralPath $log -Pattern '^row ').Count -ne 1680) {
              throw 'Expected 1680 native MUI observations'
            }
            $identity = [ordered]@{
              source_commit = $env:GITHUB_SHA
              source_sha256 = $sourceHash
              probe_sha256 = $probeHash
              kernel = [Environment]::OSVersion.Version.ToString()
              target = $env:RAX_TEST_TARGET
              machine = $machine
              ntdll_sha256 = $native
              ntdll_unchanged = $native -eq (Get-FileHash -LiteralPath $ntdll).Hash.ToLowerInvariant()
              source_unchanged = $sourceHash -eq (Get-FileHash -LiteralPath $source).Hash.ToLowerInvariant()
              probe_unchanged = $probeHash -eq (Get-FileHash -LiteralPath $exe).Hash.ToLowerInvariant()
              log_sha256 = (Get-FileHash -LiteralPath $log).Hash.ToLowerInvariant()
              payload_bytes = (Get-Item -LiteralPath $payload).Length
              payload_sha256 = (Get-FileHash -LiteralPath $payload).Hash.ToLowerInvariant()
            }
            $identity | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'native-mui-query-identity.json') -Encoding utf8
            if (!$identity.ntdll_unchanged -or !$identity.source_unchanged -or !$identity.probe_unchanged) {
              throw 'MUI probe inputs changed during measurement'
            }
          } finally {
            Pop-Location
          }
      - name: Observe native ARM64 NLS initialization
        if: ${{ !cancelled() && inputs.measure_arm64_nls_initialize && steps.stock.outcome != 'skipped' && matrix.target == 'aarch64-pc-windows-msvc' }}
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'target/windows-installed-process'
          $sources = Join-Path $env:GITHUB_WORKSPACE 'docs/specifications/windows/native-nls-initialize'
          $scratch = Join-Path $env:TMPDIR 'arm64-nls-initialize'
          New-Item -ItemType Directory -Path $scratch -Force | Out-Null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$install) { throw 'Visual Studio ARM64 compiler is unavailable' }
          Import-Module (Join-Path $install 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $install -SkipAutomaticLocation -DevCmdArguments '-arch=arm64 -host_arch=arm64'
          $ntdll = Join-Path $env:SystemRoot 'System32/ntdll.dll'
          $locale = Join-Path $env:SystemRoot 'System32/locale.nls'
          $ntdllHash = (Get-FileHash -LiteralPath $ntdll).Hash.ToLowerInvariant()
          $localeHash = (Get-FileHash -LiteralPath $locale).Hash.ToLowerInvariant()
          $identity = [ordered]@{
            source_commit = $env:GITHUB_SHA
            ntdll_sha256 = $ntdllHash
            locale_sha256 = $localeHash
            locale_bytes = (Get-Item -LiteralPath $locale).Length
            observations = [ordered]@{}
          }
          $record = Join-Path $root 'arm64-nls-initialize-identity.json'
          Push-Location -LiteralPath $scratch
          try {
            foreach ($producer in @('native-nls-initialize', 'native-nls-initialize-protection',
                                    'native-nls-initialize-leaf', 'native-nls-initialize-first-call')) {
              $source = Join-Path $sources "$producer.cpp"
              $exe = Join-Path $scratch "$producer.exe"
              $log = Join-Path $root "arm64-$producer.log"
              $sourceHash = (Get-FileHash -LiteralPath $source).Hash.ToLowerInvariant()
              & cl.exe /nologo /std:c++20 /MT /we4473 $source psapi.lib "/Fe:$exe"
              if ($LASTEXITCODE -ne 0) { throw "Native NLS producer $producer compilation failed" }
              $bytes = [System.IO.File]::ReadAllBytes($exe)
              $pe = [BitConverter]::ToInt32($bytes, 0x3c)
              if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0xAA64) {
                throw "Native NLS producer $producer has a foreign machine"
              }
              $probeHash = (Get-FileHash -LiteralPath $exe).Hash.ToLowerInvariant()
              & $exe | Set-Content -LiteralPath $log -Encoding utf8
              $exitCode = $LASTEXITCODE
              $identity.observations[$producer] = [ordered]@{
                source_sha256 = $sourceHash
                probe_sha256 = $probeHash
                log_sha256 = (Get-FileHash -LiteralPath $log).Hash.ToLowerInvariant()
                exit_code = $exitCode
                inputs_unchanged = (
                  $sourceHash -eq (Get-FileHash -LiteralPath $source).Hash.ToLowerInvariant() -and
                  $probeHash -eq (Get-FileHash -LiteralPath $exe).Hash.ToLowerInvariant()
                )
              }
              if ($exitCode -ne 0 -or !$identity.observations[$producer].inputs_unchanged -or
                  !(Select-String -LiteralPath $log -Pattern '^complete ' -Quiet)) {
                throw "Native NLS producer $producer did not complete"
              }
            }
          } finally {
            Pop-Location
            $identity.providers_unchanged = (
              $ntdllHash -eq (Get-FileHash -LiteralPath $ntdll).Hash.ToLowerInvariant() -and
              $localeHash -eq (Get-FileHash -LiteralPath $locale).Hash.ToLowerInvariant()
            )
            $identity | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $record -Encoding utf8
          }
          if (!$identity.providers_unchanged) { throw 'Native NLS provider identity changed' }
      - name: Select ARM64 Python for CSR observation
        if: ${{ !cancelled() && inputs.measure_arm64_csr && steps.stock.outcome != 'skipped' && matrix.target == 'aarch64-pc-windows-msvc' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: arm64
      - name: Observe ARM64 current-session CSR startup and metadata
        if: ${{ !cancelled() && inputs.measure_arm64_csr && steps.stock.outcome != 'skipped' && matrix.target == 'aarch64-pc-windows-msvc' }}
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$install) { throw 'Visual Studio ARM64 compiler is unavailable' }
          Import-Module (Join-Path $install 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $install -SkipAutomaticLocation -DevCmdArguments '-arch=arm64 -host_arch=arm64'
          $environment = Join-Path $env:TMPDIR 'csr-compiler-environment.json'
          $compiler = [ordered]@{}
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCTOOLSINSTALLDIR', 'VSCMD_ARG_HOST_ARCH', 'VSCMD_ARG_TGT_ARCH')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if (!$value) { throw "Missing ARM64 compiler environment variable $name" }
            $compiler[$name] = $value
          }
          $compiler | ConvertTo-Json | Set-Content -LiteralPath $environment -Encoding utf8
          python -B docs/specifications/windows/native-session-csr-connect/run-v3.py --environment $environment
          $exitCode = $LASTEXITCODE
          $capture = 'target/native-session-csr-connect-v3.json'
          if (Test-Path -LiteralPath $capture) {
            Move-Item -LiteralPath $capture -Destination 'target/windows-installed-process/native-session-csr-connect-v3.json'
          } elseif ($exitCode -eq 0) {
            throw 'ARM64 CSR capture completed without writing observations'
          }
          if ($exitCode -ne 0) { exit $exitCode }
      - name: Measure native BASE NLS replies
        if: ${{ !cancelled() && steps.stock.outcome != 'skipped' && ((inputs.measure_amd64_base_nls && matrix.target == 'x86_64-pc-windows-msvc') || (inputs.measure_arm64_base_nls && matrix.target == 'aarch64-pc-windows-msvc')) }}
        shell: pwsh
        env:
          RAX_TEST_TARGET: ${{ matrix.target }}
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'target/windows-installed-process'
          $source = Join-Path $env:GITHUB_WORKSPACE 'docs/specifications/windows/native-base-csr-nls/fixed-query.rs'
          $arch = if ($env:RAX_TEST_TARGET -eq 'aarch64-pc-windows-msvc') { 'arm64' } else { 'amd64' }
          $prefix = "native-$arch-base-nls"
          $exe = Join-Path $env:TMPDIR "$prefix.exe"
          $log = Join-Path $root "$prefix.log"
          $ntdll = Join-Path $env:SystemRoot 'System32/ntdll.dll'
          $sourceHash = (Get-FileHash -LiteralPath $source).Hash.ToLowerInvariant()
          $ntdllHash = (Get-FileHash -LiteralPath $ntdll).Hash.ToLowerInvariant()
          rustc --edition 2024 -Dwarnings --target $env:RAX_TEST_TARGET $source -o $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probeHash = (Get-FileHash -LiteralPath $exe).Hash.ToLowerInvariant()
          & $exe | Set-Content -LiteralPath $log -Encoding utf8
          $exitCode = $LASTEXITCODE
          $identity = [ordered]@{
            source_commit = $env:GITHUB_SHA
            source_sha256 = $sourceHash
            probe_sha256 = $probeHash
            ntdll_sha256 = $ntdllHash
            log_sha256 = (Get-FileHash -LiteralPath $log).Hash.ToLowerInvariant()
            exit_code = $exitCode
            inputs_unchanged = (
              $sourceHash -eq (Get-FileHash -LiteralPath $source).Hash.ToLowerInvariant() -and
              $probeHash -eq (Get-FileHash -LiteralPath $exe).Hash.ToLowerInvariant() -and
              $ntdllHash -eq (Get-FileHash -LiteralPath $ntdll).Hash.ToLowerInvariant()
            )
          }
          $identity | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root "$prefix-identity.json") -Encoding utf8
          if ($exitCode -ne 0 -or !$identity.inputs_unchanged -or
              (Select-String -LiteralPath $log -Pattern '^sample=').Count -ne 6 -or
              !(Select-String -LiteralPath $log -Pattern '^complete samples=6$' -Quiet)) {
            throw 'Native BASE NLS probe did not retain six complete observations'
          }
      - name: Measure native ARM64 mapped-filename queries
        if: ${{ !cancelled() && inputs.measure_arm64_mapped_filename && steps.stock.outcome != 'skipped' && matrix.target == 'aarch64-pc-windows-msvc' }}
        shell: pwsh
        env:
          RAX_TEST_TARGET: ${{ matrix.target }}
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'target/windows-installed-process'
          $source = Join-Path $env:GITHUB_WORKSPACE 'docs/specifications/windows/native-mapped-filename/arm64-native-local-v1.rs'
          $exe = Join-Path $env:TMPDIR 'arm64-native-local-mapped-filename.exe'
          $log = Join-Path $root 'arm64-native-local-mapped-filename.log'
          $system = Join-Path $env:SystemRoot 'System32'
          $inputs = [ordered]@{}
          foreach ($file in @($source, (Join-Path $system 'ntdll.dll'), (Join-Path $system 'kernel32.dll'), (Join-Path $system 'cmd.exe'))) {
            $inputs[$file] = (Get-FileHash -LiteralPath $file).Hash.ToLowerInvariant()
          }
          rustc --edition 2024 -Dwarnings --target $env:RAX_TEST_TARGET $source -o $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $inputs[$exe] = (Get-FileHash -LiteralPath $exe).Hash.ToLowerInvariant()
          & $exe | Set-Content -LiteralPath $log -Encoding utf8
          $exitCode = $LASTEXITCODE
          $unchanged = $true
          $identities = [ordered]@{}
          foreach ($file in $inputs.Keys) {
            if ((Get-FileHash -LiteralPath $file).Hash.ToLowerInvariant() -ne $inputs[$file]) {
              $unchanged = $false
            }
            $identities[(Split-Path -Leaf $file)] = $inputs[$file]
          }
          $identity = [ordered]@{
            source_commit = $env:GITHUB_SHA
            kernel = [Environment]::OSVersion.Version.ToString()
            target = $env:RAX_TEST_TARGET
            file_sha256 = $identities
            log_sha256 = (Get-FileHash -LiteralPath $log).Hash.ToLowerInvariant()
            exit_code = $exitCode
            inputs_unchanged = $unchanged
          }
          $identity | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'arm64-native-local-mapped-filename-identity.json') -Encoding utf8
          $completion = Select-String -LiteralPath $log -Pattern '^complete rows=(\d+)$'
          $rows = (Select-String -LiteralPath $log -Pattern '^row=').Count
          if ($exitCode -ne 0 -or !$unchanged -or $completion.Count -ne 1 -or
              $rows -lt 100 -or $rows -ne [int]$completion.Matches[0].Groups[1].Value) {
            throw 'Native ARM64 mapped-filename probe did not retain all observation rows'
          }
      - name: Preserve native process evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installed-process-${{ matrix.os }}-${{ github.sha }}
          path: |
            target/windows-installed-process/receipt.json
            target/windows-installed-process/capi.log
            target/windows-installed-process/filter-receipt.json
            target/windows-installed-process/filter-capi.log
            target/windows-installed-process/native-user-shape.log
            target/windows-installed-process/native-user-shape-identity.json
            target/windows-installed-process/startup-license.json
            target/windows-installed-process/startup-license-identity.json
            target/windows-installed-process/native-mui-query.log
            target/windows-installed-process/native-mui-query-identity.json
            target/windows-installed-process/arm64-nls-initialize-identity.json
            target/windows-installed-process/arm64-native-nls-initialize*.log
            target/windows-installed-process/native-session-csr-connect-v3.json
            target/windows-installed-process/native-*-base-nls.log
            target/windows-installed-process/native-*-base-nls-identity.json
            target/windows-installed-process/arm64-native-local-mapped-filename.log
            target/windows-installed-process/arm64-native-local-mapped-filename-identity.json
          if-no-files-found: error
