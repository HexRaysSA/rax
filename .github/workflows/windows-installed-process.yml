          $native = (Get-FileHash -LiteralPath $ntdll).Hash.ToLowerInvariant()
          $log = Join-Path $root 'native-mui-query.log'
          $sourceHash = (Get-FileHash -LiteralPath $source).Hash.ToLowerInvariant()
          Push-Location -LiteralPath $scratch
          try {
            & cl.exe /nologo /EHsc /std:c++17 "/Fe$exe" $source
            if ($LASTEXITCODE -ne 0) { throw "MUI probe compilation failed with exit code $LASTEXITCODE" }
            $pe = [IO.File]::ReadAllBytes($exe)
            $peOffset = [BitConverter]::ToInt32($pe, 0x3C)
            $machine = [BitConverter]::ToUInt16($pe, $peOffset + 4)
            if ($machine -ne $expectedMachine) { throw "MUI probe did not compile for native $arch" }
            $probeHash = (Get-FileHash -LiteralPath $exe).Hash.ToLowerInvariant()
            & $exe | Set-Content -LiteralPath $log -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw "MUI probe failed with exit code $LASTEXITCODE" }
            $payload = Join-Path $scratch 'mui.bin'
            if ((Select-String -LiteralPath $log -Pattern '^row ').Count -ne 1680) {
              throw 'Expected 1680 native MUI observations'
            }
            $identity = [ordered]@{
              source_commit = $env:GITHUB_SHA
              source_sha256 = $sourceHash
              probe_sha256 = $probeHash
              kernel = [Environment]::OSVersion.Version.ToString()
              target = $env:RAX_TEST_TARGET
              machine = $machine
              ntdll_sha256 = $native
              ntdll_unchanged = $native -eq (Get-FileHash -LiteralPath $ntdll).Hash.ToLowerInvariant()
              source_unchanged = $sourceHash -eq (Get-FileHash -LiteralPath $source).Hash.ToLowerInvariant()
              probe_unchanged = $probeHash -eq (Get-FileHash -LiteralPath $exe).Hash.ToLowerInvariant()
              log_sha256 = (Get-FileHash -LiteralPath $log).Hash.ToLowerInvariant()
              payload_bytes = (Get-Item -LiteralPath $payload).Length
              payload_sha256 = (Get-FileHash -LiteralPath $payload).Hash.ToLowerInvariant()
            }
            $identity | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'native-mui-query-identity.json') -Encoding utf8
            if (!$identity.ntdll_unchanged -or !$identity.source_unchanged -or !$identity.probe_unchanged) {
              throw 'MUI probe inputs changed during measurement'
            }
          } finally {
            Pop-Location
          }
