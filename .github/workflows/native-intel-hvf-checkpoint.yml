# Qualifies in-flight MMIO and private paging state on native Intel HVF.
name: Native Intel HVF pending checkpoint

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-15-intel
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "0"
      CARGO_PROFILE_TEST_LTO: "off"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - name: Set owned directories
        run: |
          printf 'CARGO_TARGET_DIR=%s/rax-hvf-checkpoint-target\nEVIDENCE=%s/rax-hvf-checkpoint-evidence\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Verify untranslated Intel HVF execution capability
        run: |
          mkdir -p "$EVIDENCE"
          git rev-parse HEAD > "$EVIDENCE/source-revision"
          test "$(cat "$EVIDENCE/source-revision")" = "$GITHUB_SHA"
          python3 tools/hvf/native_intel_availability.py --output "$EVIDENCE/availability"
      - name: Build and sign the native library test harness
        timeout-minutes: 45
        shell: bash
        run: |
          cargo +stable test --locked --no-default-features --features hvf \
            --lib --no-run --message-format=json > "$EVIDENCE/cargo.jsonl"
          jq -ser '
            map(select(.reason == "compiler-artifact" and .target.name == "rax"
                and (.target.kind | index("lib")) and .profile.test and .executable != null))
            | if length == 1 then .[0].executable else error("expected one RAX test harness") end
          ' "$EVIDENCE/cargo.jsonl" > "$RUNNER_TEMP/rax-hvf-checkpoint-test-path"
          binary="$(cat "$RUNNER_TEMP/rax-hvf-checkpoint-test-path")"
          entitlements="$RUNNER_TEMP/rax-hvf-checkpoint-entitlements.plist"
          python3 -c 'import plistlib, sys; open(sys.argv[1], "wb").write(
              plistlib.dumps({"com.apple.security.hypervisor": True}))' "$entitlements"
          codesign --force --sign - --entitlements "$entitlements" --timestamp=none "$binary"
          codesign --verify --strict "$binary"
          codesign -d --entitlements :- "$binary" > "$EVIDENCE/entitlements.plist"
          shasum -a 256 "$binary" > "$EVIDENCE/executable.sha256"
      - name: Resume pending MMIO from real VMM files on fresh owners
        timeout-minutes: 20
        env:
          RAX_NATIVE_CHECKPOINT_EVIDENCE: ${{ runner.temp }}/rax-hvf-checkpoint-evidence/checkpoints
        shell: bash
        run: |
          shasum -a 256 -c "$EVIDENCE/executable.sha256"
          binary="$(cat "$RUNNER_TEMP/rax-hvf-checkpoint-test-path")"
          "$binary" vm::runtime::native_intel_checkpoint_tests::pending_xmm_lane_on_secondary_survives_file_and_dispatches_once \
            --exact --ignored --nocapture --test-threads=1 2>&1 | tee "$EVIDENCE/native.log"
          grep -Eq '(^| \.\.\. )native pending XMM passed count=2 ap=1 read=true$' "$EVIDENCE/native.log"
          grep -Fx 'native pending XMM passed count=4 ap=3 read=false' "$EVIDENCE/native.log"
          test -s "$RAX_NATIVE_CHECKPOINT_EVIDENCE/pending-xmm-ap1-2cpus.rxc"
          test -s "$RAX_NATIVE_CHECKPOINT_EVIDENCE/pending-xmm-ap3-4cpus.rxc"
      - name: Resume legacy PAE with cached PDPTEs that differ from RAM
        timeout-minutes: 5
        shell: bash
        run: |
          shasum -a 256 -c "$EVIDENCE/executable.sha256"
          binary="$(cat "$RUNNER_TEMP/rax-hvf-checkpoint-test-path")"
          "$binary" vm::runtime::native_intel_checkpoint_tests::legacy_pae_requires_private_paging_bank_and_resumes_from_it \
            --exact --ignored --nocapture --test-threads=1 2>&1 | tee "$EVIDENCE/legacy-pae.log"
          grep -F 'test result: ok. 1 passed;' "$EVIDENCE/legacy-pae.log"
      - name: Preserve native qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-intel-hvf-pending-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rax-hvf-checkpoint-evidence
          if-no-files-found: error
