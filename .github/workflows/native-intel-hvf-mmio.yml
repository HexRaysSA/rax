# Executes the real RAX Intel HVF backend; capability detection is not a pass.
name: Native Intel HVF MMIO and MSR

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Apply the pinned audit source candidate before testing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Apply the pinned audit candidate
        if: ${{ inputs.candidate }}
        run: >-
          python3 tools/hvf/apply_native_candidate.py --repo .
          --manifest docs/development/hvf-intel-candidate/candidate.json
          --output "$RUNNER_TEMP/hvf-intel-candidate"
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache: "false"
      - name: Build and sign the real native consumer without guest entry
        id: build
        run: >-
          python3 tools/hvf/intel_mmio_native_probe.py
          --compile-only --export-guest --opt-level 0
          --output "$RUNNER_TEMP/hvf-intel-build"
      - name: Preserve the signed consumer before native execution
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-intel-hvf-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hvf-intel-build
          if-no-files-found: error
      - name: Preserve candidate admission evidence
        if: ${{ always() && inputs.candidate }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-intel-hvf-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hvf-intel-candidate
          if-no-files-found: error

      - name: Verify prepared source and execute the real native guests
        id: guest
        if: ${{ success() && steps.build.outcome == 'success' }}
        run: >-
          python3 tools/hvf/intel_mmio_native_probe.py
          --execute-prepared "$RUNNER_TEMP/hvf-intel-build"
          --output "$RUNNER_TEMP/hvf-intel-mmio"
      - name: Preserve execution observations
        if: ${{ always() && (steps.guest.outcome == 'success' || steps.guest.outcome == 'failure' || steps.guest.outcome == 'cancelled') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-intel-hvf-mmio-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hvf-intel-mmio
          if-no-files-found: error
