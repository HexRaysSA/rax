name: Native Windows clock profiles

on:
  push:
    branches: [master, main]
    paths:
      - .github/workflows/windows-clock-profile.yml
      - docs/specifications/windows/native-clock-profile/**
  pull_request:
    paths:
      - .github/workflows/windows-clock-profile.yml
      - docs/specifications/windows/native-clock-profile/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    name: Native clock (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Host-independent environment normalisation
        run: python docs/specifications/windows/native-clock-profile/run-v3.py --self-check
      - name: Native x64 and WoW64 clock faults
        run: python docs/specifications/windows/native-clock-profile/run-v3.py
