# Exercise the KVM backend on a real /dev/kvm.
#
# `kvm` is a default feature but Linux/x86-only and needs hardware virtualization
# at runtime, so the portable lanes (ci.yml / full-suite.yml) drop it. KVM is
# available on GitHub-hosted Linux *x64* runners (not arm64), so these jobs are
# pinned to ubuntu-24.04 and enable /dev/kvm before use.
#
# The KVM-vs-emulator differential test targets (`differential`, `diff_fuzz`) are
# gated `#![cfg(all(feature = "kvm", target_os = "linux"))]` and validate the
# interpreter + SMIR JIT bit-exactly against real hardware, so this is their only
# home.
name: KVM backend

on:
  push:
    branches: [master, main]
    paths:
      - "src/backend/kvm/**"
      - "src/backend/hvf/intel_xsave*.rs"
      - "src/vm/**"
      - "tests/suites/backend/kvm/**"
      - ".github/workflows/kvm.yml"
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      owning_library:
        description: Run the unfiltered KVM library and checkpoint test binaries
        type: boolean
        default: false

concurrency:
  group: kvm-${{ github.ref }}-${{ inputs.owning_library && github.sha || 'default' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Light job: runs on push to the KVM paths + nightly.
  kvm:
    name: kvm (linux-x64, default features)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.owning_library && 180 || 90 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          cache-key: kvm

      - name: Enable /dev/kvm access for the runner user
        run: |
          set -euxo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # Hosted runners may keep the pre-existing device node at 0660 even
          # after the udev trigger, so fix the current node explicitly too.
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm # fail fast (e.g. if on arm64)

      - name: Native XSAVE host-profile diagnostics
        run: |
          rustc --version --verbose
          rustc --edition=2024 -C target-cpu=x86-64-v3 tools/kvm/host_profile.rs -o "$RUNNER_TEMP/rax-kvm-host-profile"
          "$RUNNER_TEMP/rax-kvm-host-profile"

      - name: cargo test (KVM-gated, default features)
        run: cargo test --features x86_64-suite --test kvm_minimal -- --include-ignored --nocapture

      - name: Native RTC IRQ8 acknowledgement after detached restore
        run: |
          set -o pipefail
          case_name=vm::runtime::checkpoint_io::tests::native_rtc_irq8_acknowledgement_updates_the_restored_kernel_line
          witness="$RUNNER_TEMP/rax-kvm-rtc-irq8.out"
          cargo test --locked --features x86_64-suite --lib "$case_name" -- \
            --include-ignored --exact --test-threads=1 --nocapture --color never | tee "$witness"
          grep -F -x "test $case_name ... ok" "$witness"

      - name: Native UART IRQ4 checkpoint source and controller coherence
        run: |
          set -o pipefail
          tests=vm::runtime::checkpoint_io::tests::native_uart_irq4_
          witness="$RUNNER_TEMP/rax-kvm-uart-irq4.out"
          cargo test --locked --features x86_64-suite --lib "$tests" -- \
            --include-ignored --test-threads=1 --nocapture --color never | tee "$witness"
          grep -F -x "test ${tests}follows_the_saved_source_after_detached_restore ... ok" "$witness"
          grep -F -x "test ${tests}disagreement_rejects_before_publishing_the_vm ... ok" "$witness"
          grep -F -x "test ${tests}runtime_leaves_delivered_edge_clear_while_held ... ok" "$witness"

      - name: Native parallel PIO continuation after detached restore
        run: |
          set -o pipefail
          case_name=vm::runtime::checkpoint_io::tests::parallel_native_pio_continues_once_on_each_vcpu_after_detached_restore
          witness="$RUNNER_TEMP/rax-kvm-parallel-pio.out"
          cargo test --locked --features x86_64-suite --lib "$case_name" -- \
            --include-ignored --exact --test-threads=1 --nocapture --color never | tee "$witness"
          grep -F -x "test $case_name ... ok" "$witness"

      - name: Native VMM power-off after detached restore
        run: |
          set -o pipefail
          tests=vm::runtime::checkpoint_io::tests::runtime_native_
          witness="$RUNNER_TEMP/rax-kvm-runtime-poweroff.out"
          cargo test --locked --features x86_64-suite --lib "$tests" -- \
            --include-ignored --test-threads=1 --nocapture --color never | tee "$witness"
          grep -F -x "test ${tests}acpi_poweroff_survives_a_detached_checkpoint ... ok" "$witness"
          grep -F -x "test ${tests}shutdown_exit_survives_a_detached_checkpoint ... ok" "$witness"

      - name: Native RAX public-state, rollback, and RAM lifetime regressions
        run: |
          cargo test --features x86_64-suite --lib backend::intel_hvf_xsave::tests:: -- --test-threads=1 --nocapture
          cargo test --features x86_64-suite --lib backend::kvm::state_tests:: -- --include-ignored --test-threads=1 --nocapture
          cargo test --features x86_64-suite --lib backend::kvm::checkpoint::owner::tests::exception_events:: -- --include-ignored --test-threads=1 --nocapture
          cargo test --features x86_64-suite --lib backend::kvm::checkpoint::owner::tests::managed_pit_edge_publishes_pic_ioapic_and_only_unmasked_watchdog_nmis -- --include-ignored --test-threads=1 --nocapture
          cargo test --features x86_64-suite --lib backend::kvm::checkpoint::owner::tests::tsc_deadline:: -- --include-ignored --test-threads=1 --nocapture

      - name: Native future LAPIC deadline checkpoint
        run: |
          set -o pipefail
          case_name=vm::runtime::checkpoint_io::tests::future_native_deadline_survives_a_source_free_vmm_checkpoint
          witness="$RUNNER_TEMP/rax-kvm-future-deadline.out"
          cargo test --features x86_64-suite --lib "$case_name" -- \
            --include-ignored --exact --test-threads=1 --nocapture --color never | tee "$witness"
          grep -F -x "test $case_name ... ok" "$witness"

      - name: Native userspace LAPIC wake after all CPUs restore halted
        run: |
          set -o pipefail
          case_name=vm::runtime::checkpoint_io::tests::timer::software_lapic_timer_wakes_an_all_halted_vmm_after_detached_restore
          witness="$RUNNER_TEMP/rax-kvm-software-lapic-wake.out"
          cargo test --locked --features x86_64-suite --lib "$case_name" -- \
            --include-ignored --exact --test-threads=1 --nocapture --color never | tee "$witness"
          grep -F -x "test $case_name ... ok" "$witness"
          cargo test --locked --features x86_64-suite --lib \
            backend::kvm::checkpoint::owner::tests::device_clock:: -- --include-ignored --test-threads=1

      - name: Native UART output with userspace interrupt ownership
        run: |
          set -o pipefail
          case_name=vm::runtime::checkpoint_io::tests::stopped_native_uart_output_uses_the_userspace_irq_controller
          witness="$RUNNER_TEMP/rax-kvm-software-uart-irq.out"
          cargo test --locked --features x86_64-suite --lib "$case_name" -- \
            --include-ignored --exact --test-threads=1 --nocapture --color never | tee "$witness"
          grep -F -x "test $case_name ... ok" "$witness"

      - name: Native UART IRQ4 release after detached restore
        run: |
          set -o pipefail
          case_name=vm::runtime::checkpoint_io::tests::stopped_native_uart_receive_releases_the_level_after_detached_restore
          witness="$RUNNER_TEMP/rax-kvm-uart-irq4.out"
          cargo test --locked --features x86_64-suite --lib "$case_name" -- \
            --include-ignored --exact --test-threads=1 --nocapture --color never | tee "$witness"
          grep -F -x "test $case_name ... ok" "$witness"

      - name: Native i8042 IRQ12 after detached restore
        run: |
          set -o pipefail
          case_name=vm::runtime::checkpoint_io::tests::stopped_native_i8042_irq12_is_delivered_once_after_detached_restore
          witness="$RUNNER_TEMP/rax-kvm-i8042-irq12.out"
          cargo test --locked --features x86_64-suite --lib "$case_name" -- \
            --include-ignored --exact --test-threads=1 --nocapture --color never | tee "$witness"
          grep -F -x "test $case_name ... ok" "$witness"

      - name: Native finite entry, signal ownership, and PIO/MMIO continuation
        run: cargo test --features x86_64-suite --test kvm_host_slices -- --include-ignored --test-threads=1 --nocapture

      - name: Native secondary startup, fixed IPIs, halt/wakeup, and CPU identities
        run: cargo test --features x86_64-suite --test kvm_smp -- --include-ignored --test-threads=1 --nocapture

      - name: Unfiltered KVM and checkpoint owning binaries
        if: inputs.owning_library
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: "1"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_PROFILE_TEST_LTO: "off"
        run: |
          cargo test --locked --features x86_64-suite,debug \
            --test kvm_minimal --test kvm_host_slices --test kvm_smp --test checkpoint_cpus --test realmode_boot \
            -- --include-ignored --test-threads=1 --format=terse
          cargo test --locked --features x86_64-suite,debug --lib -- --test-threads=1 --format=terse

      - name: cargo build --release (default features, fat LTO)
        run: cargo build --release

  # Heavy job: the KVM differential corpora. Nightly / on demand only — these spin
  # up KVM VMs across large generated corpora and are far too slow for push.
  kvm-differential:
    name: kvm differential (interp + JIT vs hardware)
    if: github.event_name != 'push' && !inputs.owning_library
    runs-on: ubuntu-24.04
    # Hosted-runner CPU exposure varies and many generated cases deliberately
    # exercise optional ISA state. Preserve the nightly signal without turning
    # host capability changes into a repository-wide workflow failure.
    continue-on-error: true
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        test: [differential, diff_fuzz]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          cache-key: kvm-diff-${{ matrix.test }}

      - name: Enable /dev/kvm access for the runner user
        run: |
          set -euxo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # Hosted runners may keep the pre-existing device node at 0660 even
          # after the udev trigger, so fix the current node explicitly too.
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: cargo test --test ${{ matrix.test }} (default features incl. kvm + smir-jit)
        run: cargo test --features x86_64-suite --test ${{ matrix.test }} -- --include-ignored

  # AVX-512 differential corpus: rax interpreter vs. silicon over the full EVEX
  # state (32 ZMM + 8 opmask), injected through the KVM XSAVE/XCR0 area. Requires
  # both /dev/kvm AND a host that implements AVX-512F; the workflow probes that
  # capability and skips this binary when it is not exposed by the hosted runner.
  # The exposed CPU model and undefined architectural outputs vary between hosted
  # runners, so retain the full diagnostic log without failing the nightly run.
  # Note: NO `--include-ignored` here — ignored tests remain explicit known
  # rax↔silicon divergences and are not redundantly executed.
  kvm-avx512:
    name: kvm avx-512 differential (interp vs hardware)
    if: github.event_name != 'push' && !inputs.owning_library
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          cache-key: kvm-avx512

      - name: Enable /dev/kvm access for the runner user
        run: |
          set -euxo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Detect AVX-512 host capability
        id: avx512
        shell: bash
        run: |
          if grep -qm1 -w avx512f /proc/cpuinfo; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Skipping AVX-512 KVM differential corpus: runner CPU does not expose AVX-512F.'
          fi

      - name: Install llvm-mc (assembles the AVX-512 corpus)
        if: steps.avx512.outputs.available == 'true'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm
          # The harness looks for an unsuffixed `llvm-mc`; Ubuntu ships it
          # version-suffixed under /usr/lib/llvm-*/bin. Pin it explicitly.
          LLVM_MC_BIN="$(find /usr/lib -path '/usr/lib/llvm-*/bin/llvm-mc' -type f -print 2>/dev/null | sort -V | tail -1)"
          if [ -z "$LLVM_MC_BIN" ]; then LLVM_MC_BIN="$(command -v llvm-mc || true)"; fi
          if [ -n "$LLVM_MC_BIN" ]; then echo "LLVM_MC=$LLVM_MC_BIN" >> "$GITHUB_ENV"; fi

      - name: cargo test --test x86_64_avx512_kvm_diff (silicon oracle)
        if: steps.avx512.outputs.available == 'true'
        run: cargo test --features x86_64-suite --test x86_64_avx512_kvm_diff -- --nocapture
