# Exercise the KVM backend on a real /dev/kvm.
#
# `kvm` is a default feature but Linux/x86-only and needs hardware virtualization
# at runtime, so the portable lanes (ci.yml / full-suite.yml) drop it. KVM is
# available on GitHub-hosted Linux *x64* runners (not arm64), so these jobs are
# pinned to ubuntu-24.04 and enable /dev/kvm before use.
#
# The KVM-vs-emulator differential test targets (`differential`, `diff_fuzz`) are
# gated `#![cfg(all(feature = "kvm", target_os = "linux"))]` and validate the
# interpreter + SMIR JIT bit-exactly against real hardware, so this is their only
# home.
name: KVM backend

on:
  push:
    branches: [master, main]
    paths:
      - "src/backend/kvm/**"
      - "src/vm/**"
      - "tests/suites/backend/kvm/minimal.rs"
      - ".github/workflows/kvm.yml"
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: kvm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Light job: runs on push to the KVM paths + nightly.
  kvm:
    name: kvm (linux-x64, default features)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          cache-key: kvm

      - name: Enable /dev/kvm access for the runner user
        run: |
          set -euxo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # Hosted runners may keep the pre-existing device node at 0660 even
          # after the udev trigger, so fix the current node explicitly too.
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm # fail fast (e.g. if on arm64)

      - name: cargo test (KVM-gated, default features)
        run: cargo test --features x86_64-suite --test kvm_minimal -- --include-ignored --nocapture

      - name: Native RAX public-state, rollback, and RAM lifetime regressions
        run: cargo test --features x86_64-suite --lib backend::kvm::state_tests:: -- --include-ignored --test-threads=1 --nocapture

      - name: cargo build --release (default features, fat LTO)
        run: cargo build --release

  # Heavy job: the KVM differential corpora. Nightly / on demand only — these spin
  # up KVM VMs across large generated corpora and are far too slow for push.
  kvm-differential:
    name: kvm differential (interp + JIT vs hardware)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    # Hosted-runner CPU exposure varies and many generated cases deliberately
    # exercise optional ISA state. Preserve the nightly signal without turning
    # host capability changes into a repository-wide workflow failure.
    continue-on-error: true
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        test: [differential, diff_fuzz]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          cache-key: kvm-diff-${{ matrix.test }}

      - name: Enable /dev/kvm access for the runner user
        run: |
          set -euxo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # Hosted runners may keep the pre-existing device node at 0660 even
          # after the udev trigger, so fix the current node explicitly too.
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: cargo test --test ${{ matrix.test }} (default features incl. kvm + smir-jit)
        run: cargo test --features x86_64-suite --test ${{ matrix.test }} -- --include-ignored

  # AVX-512 differential corpus: rax interpreter vs. silicon over the full EVEX
  # state (32 ZMM + 8 opmask), injected through the KVM XSAVE/XCR0 area. Requires
  # both /dev/kvm AND a host that implements AVX-512F; the workflow probes that
  # capability and skips this binary when it is not exposed by the hosted runner.
  # The exposed CPU model and undefined architectural outputs vary between hosted
  # runners, so retain the full diagnostic log without failing the nightly run.
  # Note: NO `--include-ignored` here — ignored tests remain explicit known
  # rax↔silicon divergences and are not redundantly executed.
  kvm-avx512:
    name: kvm avx-512 differential (interp vs hardware)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          cache-key: kvm-avx512

      - name: Enable /dev/kvm access for the runner user
        run: |
          set -euxo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Detect AVX-512 host capability
        id: avx512
        shell: bash
        run: |
          if grep -qm1 -w avx512f /proc/cpuinfo; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Skipping AVX-512 KVM differential corpus: runner CPU does not expose AVX-512F.'
          fi

      - name: Install llvm-mc (assembles the AVX-512 corpus)
        if: steps.avx512.outputs.available == 'true'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm
          # The harness looks for an unsuffixed `llvm-mc`; Ubuntu ships it
          # version-suffixed under /usr/lib/llvm-*/bin. Pin it explicitly.
          LLVM_MC_BIN="$(find /usr/lib -path '/usr/lib/llvm-*/bin/llvm-mc' -type f -print 2>/dev/null | sort -V | tail -1)"
          if [ -z "$LLVM_MC_BIN" ]; then LLVM_MC_BIN="$(command -v llvm-mc || true)"; fi
          if [ -n "$LLVM_MC_BIN" ]; then echo "LLVM_MC=$LLVM_MC_BIN" >> "$GITHUB_ENV"; fi

      - name: cargo test --test x86_64_avx512_kvm_diff (silicon oracle)
        if: steps.avx512.outputs.available == 'true'
        run: cargo test --features x86_64-suite --test x86_64_avx512_kvm_diff -- --nocapture
