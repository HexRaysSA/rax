[workspace]
members = ["capi"]
# Standalone in-tree packages that build independently (own targets / build
# scripts) and must NOT be pulled into this workspace.
exclude = [
    "microkernel",
    "tools/asl-parser/asl-parser-rs",
    "_ref",
]

[package]
name = "rax"
version = "0.1.0"
edition = "2024"
autotests = false
description = "Multi-ISA emulator and virtual-machine monitor"
license = "MIT AND BSD-3-Clause"
repository = "https://github.com/HexRaysSA/rax"
readme = "README.md"
# Ship engine source, not reference documents, guest images or local research.
include = [
    "/src/**/*.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
]

[[bin]]
name = "rax-isa-oracle"
path = "src/bin/rax_isa_oracle.rs"

[[bin]]
name = "rax-user"
path = "src/bin/rax_user.rs"

# Integration tests live in semantic subdirectories. Explicit declarations
# make build participation independent of filesystem accidents and keep
# generated Rust data from becoming standalone test binaries.
